    const STORAGE_KEY = 'STOCK_RADAR_DATA_V2_PROVENANCE_20260920';
    const API_TIMEOUT_MS = 6500;
    const REFRESH_MS = 5000;
    const STALE_AFTER_MS = 20000;
    const SEARCH_DEBOUNCE_MS = 280;

    let currentMainTab = 'AI_PICKS';
    let lastSuccessfulSync = null;
    let searchTimer = null;
    let searchRequestSequence = 0;
    let latestSearchResults = [];
    let selectedPriceRate = 0;

    const STOCK_DATABASE = [
      {

        valuation: {

          baseMetricValue: 213800,

        },

        entryModel: {
          fairValueDiscountLow: 17.7,

          technicalSupport: 252000,
          volatilityAdjustment: -1.2,
          techPoint: '직전 고점 돌파 후 지지선 확인'
        },

        thesis: '차세대 HBM 공급 가시화 및 파운드리 수율 개선',
        risk: '글로벌 반도체 수급 사이클 변동성',
        source: '샘플 데이터 — 실제 사용 전 원천 확인 필요',
        asOfDate: '2026-09-20',
        lastCalculatedAt: '2026-09-20T06:00:00Z',
        provenanceVerified: false
      },

      {
        name: 'SK하이닉스',
        ticker: '000660',
        market: 'KOSPI',
        currentPrice: 1849000,
        dayChangeRate: 5.95,
        buyZoneLow: 1720000,
        buyZoneHigh: 1780000,
        stopLoss: 1590000,
        isAiRecommended: false,

        valuation: {
          model: '12M Forward EPS × Target PER',
          baseMetricLabel: '12M Forward EPS',
          baseMetricValue: null,
          targetMultipleLabel: 'Target PER',
          targetMultipleValue: 7.2,
          fairValue: 2100000,
          bearValue: null,
          bullValue: null
        },

        entryModel: {
          technicalSupport: 1750000,
          volatilityAdjustment: null,
          techPoint: '전고점 돌파 후 60일선 지지 확인 구간'
        },

        thesis: 'HBM 수요와 AI 가속기 탑재량 확대',
        risk: '빅테크 CapEx 둔화 및 고점 밸류에이션 부담',
        source: '샘플 데이터 — 실제 사용 전 원천 확인 필요',
        asOfDate: '2026-09-20',
        lastCalculatedAt: '2026-09-20T06:00:00Z',
        provenanceVerified: false
      },

      {
        name: 'TIGER 미국S&P500',
        ticker: '360750',
        market: 'ETF',
        currentPrice: 26280,
        dayChangeRate: 0.15,
        buyZoneLow: 24800,
        buyZoneHigh: 25900,
        stopLoss: 23500,
        isAiRecommended: true,

        valuation: {
          model: '지수 Forward P/E 및 환율 보정',
          baseMetricLabel: 'Forward EPS',
          baseMetricValue: null,
          targetMultipleLabel: 'Target P/E',
          targetMultipleValue: 21.5,
          fairValue: 31000,
          bearValue: null,
          bullValue: null
        },

        entryModel: {
          technicalSupport: 25500,
          volatilityAdjustment: null,
          techPoint: '120일 이동평균선 및 환율 민감도 확인'
        },

        thesis: '미국 대형주 분산 장기 코어 자산',
        risk: '미국 밸류에이션 및 원/달러 환율 변동성',
        source: '샘플 데이터 — 실제 사용 전 원천 확인 필요',
        asOfDate: '2026-09-20',
        lastCalculatedAt: '2026-09-20T06:00:00Z',
        provenanceVerified: false
      }
    ];

    let userStocks = loadStocks();

    function hydrateStock(stock) {
      return {
        ...stock,
        id: stock.id || `stock-${stock.ticker}`,
        inWatchlist:
          stock.inWatchlist ??
          ['005930', '000660', '360750'].includes(stock.ticker),
        expanded: false
      };
    }

    function loadStocks() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (saved) {
          return JSON.parse(saved).map(hydrateStock);
        }
      } catch (error) {
        console.warn('저장된 종목 데이터를 불러오지 못했습니다.', error);
      }

      return STOCK_DATABASE.map(hydrateStock);
    }

    function saveStocks() {
      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(userStocks)
        );
      } catch (error) {
        console.warn('종목 데이터를 저장하지 못했습니다.', error);
      }
    }

    function numberOrNull(value) {
      if (
        value === null ||
        value === undefined ||
        value === ''
      ) {
        return null;
      }

      return Number(value);
    }

    function formatKRW(value) {
      if (
        value === null ||
        value === undefined ||
        value === '' ||
        !Number.isFinite(Number(value))
      ) {
        return '-';
      }

      return `${Number(value).toLocaleString('ko-KR')}원`;
    }

    function formatDateTime(value) {
      if (!value) {
        return '-';
      }

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return value;
      }

      return date.toLocaleString('ko-KR', {
        timeZone: 'Asia/Seoul',
        hour12: false
      });
    }

    function escapeHTML(value) {
      return String(value ?? '').replace(
        /[&<>'"]/g,
        (character) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        })[character]
      );
    }

    function calculateRiskReward(stock) {
      const entry =
        (
          Number(stock.buyZoneLow) +
          Number(stock.buyZoneHigh)
        ) / 2;

      const stop = Number(stock.stopLoss);
      const target = Number(
        stock.analysis?.targetPrice ??
        stock.valuation?.fairValue
      );

      const risk = entry - stop;
      const reward = target - entry;

      if (
        ![entry, stop, target, risk, reward].every(Number.isFinite) ||
        risk <= 0 ||
        reward <= 0
      ) {
        return null;
      }

      return {
        entry,
        risk,
        reward,
        ratio: reward / risk
      };
    }

    function diagnoseStock(stock) {
      const currentPrice = Number(stock.currentPrice);
      const buyLow = Number(stock.buyZoneLow);
      const buyHigh = Number(stock.buyZoneHigh);
      const stopLoss = Number(stock.stopLoss);

      if (stock.analysisState === 'RUNNING') {
        return {
          status: 'ANALYZING',
          badgeText: '분석 중',
          badgeClass:
            'bg-blue-500/20 text-blue-300 border-blue-500/40 pulse-soft',
          title: '최근 일봉 분석 중',
          desc:
            '이동평균·RSI·ATR·거래량과 지지·저항을 계산하고 있습니다.',
          posType: 'NEUTRAL'
        };
      }

      if (
        stock.analysisState === 'NOT_QUALIFIED' ||
        stock.analysis?.status === 'NOT_QUALIFIED'
      ) {
        return {
          status: 'NOT_QUALIFIED',
          badgeText: '조건 미충족',
          badgeClass:
            'bg-slate-700 text-slate-300 border-slate-600',
          title: '기술적 Buy Zone 미확정',
          desc:
            (stock.analysis?.warnings || []).join(' ') ||
            '점수·가격 구조·손익비 조건을 모두 충족하지 않아 Buy Zone을 만들지 않았습니다.',
          posType: 'NEUTRAL'
        };
      }

      if (stock.analysisState === 'ERROR') {
        return {
          status: 'ANALYSIS_ERROR',
          badgeText: '분석 재시도 필요',
          badgeClass:
            'bg-rose-500/20 text-rose-300 border-rose-500/40',
          title: '기술분석을 완료하지 못했습니다',
          desc:
            stock.analysisError ||
            '일봉 서비스를 잠시 사용할 수 없습니다.',
          posType: 'NEUTRAL'
        };
      }

      const hasPriceModel =
        [buyLow, buyHigh, stopLoss].every(
          (value) => Number.isFinite(value) && value > 0
        );

      if (!hasPriceModel) {
        return {
          status: 'ANALYSIS_PENDING',
          badgeText: '분석 대기',
          badgeClass:
            'bg-blue-500/20 text-blue-300 border-blue-500/40',
          title: '관심 종목 저장 완료',
          desc:
            '현재가는 추적 중입니다. 검증된 Buy Zone이 입력되기 전에는 매수 신호를 표시하지 않습니다.',
          posType: 'NEUTRAL'
        };
      }

      if (
        !Number.isFinite(currentPrice) ||
        !(stopLoss < buyLow && buyLow <= buyHigh)
      ) {
        return {
          status: 'INVALID',
          badgeText: '⚠ 모델 오류',
          badgeClass:
            'bg-rose-500/20 text-rose-300 border-rose-500/40',
          title: '가격 모델 점검 필요',
          desc:
            '손절선 < Buy Zone 하단 ≤ 상단 조건을 확인하세요.',
          posType: 'NEUTRAL'
        };
      }

      if (currentPrice < stopLoss) {
        const difference =
          ((stopLoss - currentPrice) / stopLoss) * 100;

        return {
          status: 'STOP_LOSS',
          badgeText:
            `손절선 이탈 (-${difference.toFixed(1)}%)`,
          badgeClass:
            'bg-rose-500/20 text-rose-300 border-rose-500/40',
          title: '신규 매수 보류',
          desc:
            `손절선 ${formatKRW(stopLoss)} 아래입니다. ` +
            '모델과 투자 논리를 재검토하세요.',
          posType: 'BELOW'
        };
      }

      if (currentPrice < buyLow) {
        const difference =
          ((buyLow - currentPrice) / buyLow) * 100;

        return {
          status: 'BELOW_ZONE',
          badgeText:
            `밴드 하단 아래 (-${difference.toFixed(1)}%)`,
          badgeClass:
            'bg-violet-500/20 text-violet-300 border-violet-500/40',
          title: '가격 하락 원인 재검증',
          desc:
            '싸졌다는 이유만으로 매수하지 말고 펀더멘털 훼손 여부를 먼저 확인하세요.',
          posType: 'BELOW_ZONE'
        };
      }

      if (currentPrice <= buyHigh) {
        const midpoint = (buyLow + buyHigh) / 2;

        const step =
          currentPrice <= midpoint
            ? '2차 적극 분할 후보'
            : '1차 분할 후보';

        return {
          status: 'IN_ZONE',
          badgeText: `🎯 ${step}`,
          badgeClass:
            'bg-emerald-500/20 text-emerald-300 border-emerald-500/50 pulse-soft font-bold',
          title: 'Buy Zone 진입',
          desc:
            '가격 조건을 충족했습니다. 최신 산출근거와 리스크 확인 후 집행하세요.',
          posType: 'INSIDE'
        };
      }

      const gap =
        ((currentPrice - buyHigh) / buyHigh) * 100;

      if (gap <= 1) {
        return {
          status: 'IMMINENT',
          badgeText: `⚡ 임박 (+${gap.toFixed(1)}%)`,
          badgeClass:
            'bg-amber-500/20 text-amber-300 border-amber-500/40',
          title: '매수구간 임박',
          desc:
            `상단까지 약 ${gap.toFixed(1)}% 조정이 필요합니다.`,
          posType: 'ABOVE',
          gap
        };
      }

      if (gap <= 3) {
        return {
          status: 'APPROACHING',
          badgeText: `접근 중 (+${gap.toFixed(1)}%)`,
          badgeClass:
            'bg-orange-500/20 text-orange-300 border-orange-500/40',
          title: '접근 중 · 아직 관망',
          desc:
            `Buy Zone 상단보다 ${gap.toFixed(1)}% 높습니다. 추격하지 않습니다.`,
          posType: 'ABOVE',
          gap
        };
      }

      return {
        status: 'OVER_PRICED',
        badgeText: `범위 초과 (+${gap.toFixed(1)}%)`,
        badgeClass:
          'bg-slate-800 text-slate-400 border-slate-700',
        title: '관망 · 추격매수 금지',
        desc:
          `Buy Zone 상단보다 ${gap.toFixed(1)}% 높습니다.`,
        posType: 'ABOVE',
        gap
      };
    }

    function renderRangeBar(stock, diagnosis) {
      if (
        [
          'ANALYSIS_PENDING',
          'ANALYZING',
          'NOT_QUALIFIED',
          'ANALYSIS_ERROR'
        ].includes(diagnosis.status)
      ) {
        const running = diagnosis.status === 'ANALYZING';
        const tone = diagnosis.status === 'ANALYSIS_ERROR'
          ? 'border-rose-500/30 bg-rose-500/5 text-rose-200'
          : 'border-blue-500/20 bg-blue-500/5 text-blue-200';

        return `
          <div class="mt-2.5 pt-2 border-t border-slate-800">
            <div class="rounded-lg border ${tone} px-2.5 py-2 text-[11px]">
              <div class="flex items-center justify-between gap-2">
                <span>
                  ${running
                    ? '최근 일봉·거래량 분석 중…'
                    : diagnosis.status === 'NOT_QUALIFIED'
                      ? `기술 점수 ${stock.analysis?.technicalScore ?? '-'}점 · 손익비 1:${stock.analysis?.riskReward ?? '-'}`
                      : diagnosis.status === 'ANALYSIS_ERROR'
                        ? '분석 API 연결을 확인해주세요.'
                        : 'Buy Zone 분석 대기 · 현재가 추적 중'}
                </span>
                <button
                  type="button"
                  onclick="runTechnicalAnalysis('${stock.id}')"
                  ${running ? 'disabled' : ''}
                  class="shrink-0 rounded-md border border-blue-500/40 px-2 py-1 font-semibold text-blue-300 disabled:opacity-50">
                  ${running ? '계산 중' : '기술분석 실행'}
                </button>
              </div>
            </div>
          </div>
        `;
      }

      const stop = Number(stock.stopLoss);
      const buyLow = Number(stock.buyZoneLow);
      const buyHigh = Number(stock.buyZoneHigh);
      const target = Number(
        stock.analysis?.targetPrice ??
        stock.valuation?.fairValue
      );
      const currentPrice = Number(stock.currentPrice);

      const minimum = Math.min(stop, currentPrice);
      const maximum = Math.max(target, currentPrice, buyHigh);
      const span = maximum - minimum || 1;

      const percentage = (value) => {
        return Math.max(
          0,
          Math.min(
            100,
            ((value - minimum) / span) * 100
          )
        );
      };

      const bandLeft = percentage(buyLow);

      const bandWidth = Math.max(
        1,
        percentage(buyHigh) - bandLeft
      );

      const markerPosition = percentage(currentPrice);

      let markerColor =
        'bg-amber-400';

      if (diagnosis.status === 'IN_ZONE') {
        markerColor =
          'bg-emerald-400 ring-2 ring-emerald-300';
      } else if (diagnosis.status === 'STOP_LOSS') {
        markerColor = 'bg-rose-400';
      } else if (diagnosis.status === 'BELOW_ZONE') {
        markerColor = 'bg-violet-400';
      }

      return `
        <div class="mt-2.5 pt-2 border-t border-slate-800">

          <div class="flex items-center justify-between text-[11px] mb-1">

            <span class="text-slate-400">
              Buy Zone
              <b class="text-slate-200">
                ${formatKRW(buyLow)} ~ ${formatKRW(buyHigh)}
              </b>
            </span>

            <span class="font-bold ${
              diagnosis.status === 'IN_ZONE'
                ? 'text-emerald-400'
                : 'text-slate-400'
            }">
              현재 ${formatKRW(currentPrice)}
            </span>
          </div>

          <div class="relative w-full h-2 bg-slate-900 rounded-full border border-slate-700/80 my-1.5">

            <div
              class="absolute inset-y-0 bg-emerald-500/30 border-x border-emerald-500/60"
              style="left:${bandLeft}%; width:${bandWidth}%">
            </div>

            <div
              class="absolute top-1/2 -translate-y-1/2 w-2.5 h-2.5 rounded-full ${markerColor} shadow"
              style="left:${markerPosition}%; transform:translate(-50%, -50%)">
            </div>
          </div>

          <div class="flex justify-between text-[9px] text-slate-500">
            <span>축 하단 ${formatKRW(minimum)}</span>
            <span>손절 ${formatKRW(stop)}</span>
            <span>${stock.analysis?.targetPrice ? '기술 목표' : 'Base'} ${formatKRW(target)}</span>
          </div>
        </div>
      `;
    }

    function renderProvenance(stock) {
      const valuation = stock.valuation || {};
      const entryModel = stock.entryModel || {};
      const riskReward = calculateRiskReward(stock);
      const analysis = stock.analysis || null;

      const analysisDetails = analysis
        ? `
          <div class="rounded-lg border border-blue-500/20 bg-blue-500/5 p-2 text-[10px] text-slate-300">
            <div class="flex justify-between gap-2">
              <b class="text-blue-300">
                자동 기술분석 · ${escapeHTML(analysis.strategyName || analysis.status || '-')}
              </b>
              <span>
                ${analysis.technicalScore ?? '-'}점
              </span>
            </div>
            <div class="mt-1 text-slate-400">
              ${(analysis.reasons || []).map(escapeHTML).join('<br>')}
            </div>
            ${(analysis.warnings || []).length
              ? `<div class="mt-1 text-amber-300">${analysis.warnings.map(escapeHTML).join('<br>')}</div>`
              : ''}
            <div class="mt-1 text-slate-500">
              기술적 참고 모델 · 적정가나 수익을 보장하지 않습니다.
            </div>
          </div>
        `
        : '';

      const calculationPossible =
        Number.isFinite(Number(valuation.baseMetricValue)) &&
        Number.isFinite(Number(valuation.targetMultipleValue));

      const calculatedFairValue =
        calculationPossible
          ? Number(valuation.baseMetricValue) *
            Number(valuation.targetMultipleValue)
          : null;

      const calculationDifference =
        calculatedFairValue && valuation.fairValue
          ? (
              (
                Number(valuation.fairValue) -
                calculatedFairValue
              ) /
              calculatedFairValue
            ) * 100
          : null;

      return `
        <div class="mt-1.5 p-2.5 rounded-lg bg-slate-950 border border-slate-800 text-[11px] space-y-2 text-slate-300">

          ${analysisDetails}

          <div class="flex items-center justify-between">
            <b class="text-blue-300">
              Valuation
            </b>

            <span class="${
              stock.provenanceVerified
                ? 'text-emerald-400'
                : 'text-amber-400'
            }">
              ${
                stock.provenanceVerified
                  ? '원천 검증됨'
                  : '⚠ 원천 미검증'
              }
            </span>
          </div>

          <div class="grid grid-cols-[1fr_auto] gap-x-3 gap-y-1">

            <span class="text-slate-400">
              모델
            </span>

            <span class="text-right">
              ${escapeHTML(valuation.model || '-')}
            </span>

            <span class="text-slate-400">
              ${escapeHTML(
                valuation.baseMetricLabel || '기초 지표'
              )}
            </span>

            <span class="font-mono">
              ${valuation.baseMetricValue ?? '-'}
            </span>

            <span class="text-slate-400">
              ${escapeHTML(
                valuation.targetMultipleLabel || '목표 배수'
              )}
            </span>

            <span class="font-mono">
              ${valuation.targetMultipleValue ?? '-'}
            </span>

            <span class="text-slate-400">
              산식 결과
            </span>

            <span class="font-mono">
              ${
                calculatedFairValue
                  ? formatKRW(
                      Math.round(calculatedFairValue)
                    )
                  : '입력 미완료'
              }
            </span>

            <span class="text-slate-400">
              Base Fair Value
            </span>

            <span class="font-mono text-blue-300">
              ${formatKRW(valuation.fairValue)}
            </span>

            ${
              calculationDifference !== null &&
              Math.abs(calculationDifference) > 0.5
                ? `
                  <span class="text-rose-300 col-span-2">
                    ⚠ 산식 결과와 Base 적정가 차이
                    ${calculationDifference.toFixed(1)}%
                  </span>
                `
                : ''
            }

            <span class="text-slate-400">
              Bear / Bull
            </span>

            <span class="font-mono">
              ${formatKRW(valuation.bearValue)}
              /
              ${formatKRW(valuation.bullValue)}
            </span>
          </div>

          <div class="pt-2 border-t border-slate-800">
            <b class="text-emerald-300">
              Entry Model
            </b>
          </div>

          <div class="grid grid-cols-[1fr_auto] gap-x-3 gap-y-1">

            <span class="text-slate-400">
              기술적 지지
            </span>

            <span>
              ${formatKRW(entryModel.technicalSupport)}
            </span>

            <span class="text-slate-400">
              변동성 보정
            </span>

            <span>
              ${entryModel.volatilityAdjustment ?? '-'}
              ${
                entryModel.volatilityAdjustment != null
                  ? '%'
                  : ''
              }
            </span>

            <span class="text-slate-400">
              최종 Buy Zone
            </span>

            <span class="text-emerald-300">
              ${formatKRW(stock.buyZoneLow)}
              ~
              ${formatKRW(stock.buyZoneHigh)}
            </span>

            <span class="text-slate-400">
              기준 진입가
            </span>

            <span>
              ${
                riskReward
                  ? formatKRW(riskReward.entry)
                  : '-'
              }
              (밴드 중앙)
            </span>

            <span class="text-slate-400">
              자동 손익비
            </span>

            <span class="font-mono">
              ${
                riskReward
                  ? `1 : ${riskReward.ratio.toFixed(2)}`
                  : '계산 불가'
              }
            </span>
          </div>

          <div class="pt-2 border-t border-slate-800 space-y-1 text-[10px] text-slate-400">

            <div>
              📐 <b>기술적 근거:</b>
              ${escapeHTML(entryModel.techPoint || '-')}
            </div>

            <div>
              💡 <b>핵심 논리:</b>
              ${escapeHTML(stock.thesis || '-')}
            </div>

            <div>
              ⚠️ <b>핵심 리스크:</b>
              ${escapeHTML(stock.risk || '-')}
            </div>

            <div>
              🔗 <b>출처:</b>
              ${escapeHTML(stock.source || '-')}
            </div>

            <div>
              🗓 <b>기준일:</b>
              ${escapeHTML(stock.asOfDate || '-')}
              · 재계산
              ${formatDateTime(stock.lastCalculatedAt)}
            </div>
          </div>
        </div>
      `;
    }

    function renderList() {
      const aiPicks = userStocks.filter((stock) => {
        const diagnosis = diagnoseStock(stock);

        return (
          stock.isAiRecommended &&
          [
            'IN_ZONE',
            'IMMINENT',
            'APPROACHING'
          ].includes(diagnosis.status)
        );
      });

      const watchlist = userStocks.filter(
        (stock) => stock.inWatchlist
      );

      document.getElementById(
        'countAiPicks'
      ).textContent = aiPicks.length;

      document.getElementById(
        'countWatchlist'
      ).textContent = watchlist.length;

      const displayList =
        currentMainTab === 'AI_PICKS'
          ? aiPicks
          : watchlist;

      const container =
        document.getElementById('stockListContainer');

      const emptyState =
        document.getElementById('emptyState');

      if (!displayList.length) {
        container.innerHTML = '';

        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');

        document.getElementById(
          'emptyStateText'
        ).textContent =
          currentMainTab === 'AI_PICKS'
            ? '추천 후보군 중 현재 가격 조건을 충족한 종목이 없습니다.'
            : '상단에서 관심 종목을 등록하세요.';

        return;
      }

      emptyState.classList.add('hidden');
      emptyState.classList.remove('flex');

      container.innerHTML = displayList.map((stock) => {
        const diagnosis = diagnoseStock(stock);
        const isUp = Number(stock.dayChangeRate) > 0;
        const targetValue =
          stock.analysis?.targetPrice ??
          stock.valuation?.fairValue;

        const target =
          targetValue === null ||
          targetValue === undefined ||
          targetValue === ''
            ? null
            : Number(targetValue);

        const upside =
          target !== null &&
          target > 0
            ? (
                (
                  target -
                  Number(stock.currentPrice)
                ) /
                Number(stock.currentPrice)
              ) * 100
            : null;

        const riskReward =
          calculateRiskReward(stock);

        const stockUrl =
          ['KOSPI', 'KOSDAQ', 'ETF'].includes(
            stock.market
          )
            ? `https://m.stock.naver.com/domestic/stock/${encodeURIComponent(stock.ticker)}/total`
            : '#';

        return `
          <article class="bg-finCard rounded-xl border border-finBorder p-3.5 shadow-lg">

            <div class="flex items-start justify-between gap-2">

              <div>
                <div class="flex items-center gap-1.5">

                  <a
                    href="${stockUrl}"
                    ${
                      stockUrl === '#'
                        ? ''
                        : 'target="_blank" rel="noopener noreferrer"'
                    }
                    class="text-sm font-bold text-white hover:text-blue-400">

                    ${escapeHTML(stock.name)} ↗
                  </a>

                  <span class="text-[10px] font-mono text-slate-400">
                    ${escapeHTML(stock.ticker)}
                  </span>

                  <span class="text-[9px] px-1 rounded bg-slate-800 text-slate-300 border border-slate-700">
                    ${escapeHTML(stock.market)}
                  </span>
                </div>

                <div class="flex items-baseline gap-2 mt-0.5">

                  <span class="text-lg font-extrabold font-mono">
                    ${formatKRW(stock.currentPrice)}
                  </span>

                  <span class="text-[11px] font-semibold ${
                    isUp
                      ? 'text-rose-400'
                      : 'text-blue-400'
                  }">
                    ${isUp ? '+' : ''}
                    ${Number(
                      stock.dayChangeRate || 0
                    ).toFixed(2)}%
                  </span>
                </div>
              </div>

              <div class="flex flex-col items-end gap-1">

                <span class="px-2 py-0.5 rounded-full border text-[11px] font-semibold ${diagnosis.badgeClass}">
                  ${diagnosis.badgeText}
                </span>

                <button
                  onclick="toggleWatchlist('${stock.id}')"
                  class="text-[10px] text-slate-400 hover:text-blue-400">

                  ${
                    stock.inWatchlist
                      ? '★ 관심종목'
                      : '＋ 관심종목'
                  }
                </button>
              </div>
            </div>

            ${renderRangeBar(stock, diagnosis)}

            <div class="mt-2.5 p-2 rounded-lg bg-slate-900/90 border border-slate-800 text-xs">

              <div class="flex justify-between gap-2">

                <span>
                  <b class="text-blue-400">
                    진단:
                  </b>

                  <b class="text-slate-200">
                    ${diagnosis.title}
                  </b>
                </span>

                <span class="text-[10px] text-slate-400 whitespace-nowrap">
                  ${stock.analysis?.targetPrice ? '기술 목표' : 'Base'} ${formatKRW(target)}

                  ${
                    upside !== null
                      ? ` (${upside >= 0 ? '+' : ''}${upside.toFixed(1)}%)`
                      : ''
                  }
                </span>
              </div>

              <p class="text-[10px] text-slate-500 mt-1">
                ${diagnosis.desc}
              </p>
            </div>

            <div class="mt-2">

              <button
                onclick="toggleProvenance('${stock.id}')"
                class="w-full flex justify-between py-1 text-[11px] text-slate-400 hover:text-slate-200">

                <span>
                  📊 산출 근거
                  ${stock.expanded ? '접기 ▲' : '상세보기 ▼'}
                </span>

                <span>
                  손익비
                  ${
                    riskReward
                      ? `1:${riskReward.ratio.toFixed(2)}`
                      : '계산 불가'
                  }
                </span>
              </button>

              ${
                stock.expanded
                  ? renderProvenance(stock)
                  : ''
              }
            </div>
          </article>
        `;
      }).join('');
    }

    function switchMainTab(tab) {
      currentMainTab = tab;

      document.getElementById(
        'tabBtnAi'
      ).className = `
        py-1.5 rounded-md
        ${
          tab === 'AI_PICKS'
            ? 'bg-blue-600 text-white shadow font-bold'
            : 'text-slate-400 hover:text-white'
        }
      `;

      document.getElementById(
        'tabBtnWatch'
      ).className = `
        py-1.5 rounded-md
        ${
          tab === 'WATCHLIST'
            ? 'bg-blue-600 text-white shadow font-bold'
            : 'text-slate-400 hover:text-white'
        }
      `;

      renderList();
    }

    function toggleProvenance(id) {
      const stock = userStocks.find(
        (item) => item.id === id
      );

      if (!stock) {
        return;
      }

      stock.expanded = !stock.expanded;
      renderList();
    }

    function toggleWatchlist(id) {
      const stock = userStocks.find(
        (item) => item.id === id
      );

      if (!stock) {
        return;
      }

      stock.inWatchlist = !stock.inWatchlist;

      saveStocks();
      renderList();
    }

      const element =
        document.createElement('div');

      element.className = `
        pointer-events-auto rounded-lg border
        bg-slate-900 px-3 py-2 text-xs shadow-xl
        ${
          tone === 'red'
            ? 'border-rose-500/50 text-rose-300'
            : 'border-blue-500/50 text-blue-300'
        }
      `;

      element.textContent = message;

      document.getElementById(
        'toastContainer'
      ).appendChild(element);

      setTimeout(() => {
        element.remove();
      }, 3200);
    }

              <b>${escapeHTML(stock.name)}</b>
              <span class="ml-1 text-[10px] text-slate-500">
                ${escapeHTML(stock.market)}
              </span>
            </span>

            <span class="font-mono text-emerald-400">
              ${escapeHTML(stock.ticker)}
            </span>
          </button>
        `;
      }).join('');

      dropdown.classList.remove('hidden');
    }

    function handleSmartSearch(searchValue) {
      const query = searchValue.trim();
      clearTimeout(searchTimer);

      if (!query) {
        document.getElementById(
          'searchResultsDropdown'
        ).classList.add('hidden');
        latestSearchResults = [];
        return;
      }

      const localMatches =
        STOCK_DATABASE.filter((stock) => {
          const normalized = query.toLowerCase();

          return (
            stock.name.toLowerCase().includes(normalized) ||
            stock.ticker.includes(normalized)
          );
        }).map((stock) => ({
          name: stock.name,
          ticker: stock.ticker,
          market: stock.market,
          preset: true
        }));

      if (localMatches.length) {
        renderSearchResults(localMatches);
      } else {
        renderSearchResults([], '국내 종목 검색 중…');
      }

      const requestSequence =
        ++searchRequestSequence;

      searchTimer = setTimeout(async () => {
        try {
          const response = await fetch(
            `/api/search?q=${encodeURIComponent(query)}`,
            { cache: 'no-store' }
          );

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const data = await response.json();

          if (
            requestSequence !== searchRequestSequence ||
            !data.success
          ) {
            return;
          }

          const combined = [
            ...localMatches,
            ...(data.results || [])
          ];

          const seen = new Set();
          const deduplicated = combined.filter((stock) => {
            if (!stock.ticker || seen.has(stock.ticker)) {
              return false;
            }

            seen.add(stock.ticker);
            return true;
          });

          renderSearchResults(deduplicated);
        } catch (error) {
          if (requestSequence !== searchRequestSequence) {
            return;
          }

          if (!localMatches.length) {
            renderSearchResults(
              [],
              '검색 서비스를 사용할 수 없습니다. 티커와 종목명을 직접 입력하세요.'
            );
          }
        }
      }, SEARCH_DEBOUNCE_MS);
    }

    function populateStockForm(stock) {
      const values = {
        inputName: stock.name,
        inputMarket: stock.market,
        inputTicker: stock.ticker,
        inputCurrentPrice: stock.currentPrice,
        inputBuyLow: stock.buyZoneLow,
        inputBuyHigh: stock.buyZoneHigh,
        inputStopLoss: stock.stopLoss,
        inputFairValue: stock.valuation?.fairValue,
        inputBaseMetric:
          stock.valuation?.baseMetricValue,
        inputTargetMultiple:
          stock.valuation?.targetMultipleValue,
        inputModel:
          stock.valuation?.model,
        inputTechPoint:
          stock.entryModel?.techPoint,
        inputSource:
          stock.source,
        inputAsOfDate:
          stock.asOfDate
      };

      Object.entries(values).forEach(
        ([elementId, value]) => {
          document.getElementById(
            elementId
          ).value = value ?? '';
        }
      );

      document.getElementById(
        'inputAiRecommended'
      ).checked = Boolean(stock.isAiRecommended);

      selectedPriceRate =
        Number(stock.dayChangeRate) || 0;
    }

    function clearPriceModelFields() {
      [
        'inputBuyLow',
        'inputBuyHigh',
        'inputStopLoss',
        'inputFairValue',
        'inputBaseMetric',
        'inputTargetMultiple',
        'inputModel',
        'inputTechPoint',
        'inputSource'
      ].forEach((elementId) => {
        document.getElementById(elementId).value = '';
      });

      document.getElementById(
        'inputAiRecommended'
      ).checked = false;
    }

    async function fetchPriceIntoForm(ticker) {
      const priceInput =
        document.getElementById('inputCurrentPrice');

      priceInput.placeholder = '현재가 불러오는 중…';

      try {
        const response = await fetch(
          `/api/prices?tickers=${encodeURIComponent(ticker)}`,
          { cache: 'no-store' }
        );

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        const priceInformation = data.prices?.[ticker];

        if (
          !priceInformation?.success ||
          Number(priceInformation.price) <= 0
        ) {
          throw new Error('price unavailable');
        }

        priceInput.value =
          Number(priceInformation.price);

        selectedPriceRate =
          Number(priceInformation.rate) || 0;

        priceInput.placeholder = '현재가';
      } catch (error) {
        priceInput.placeholder =
          '자동 조회 실패 — 직접 입력';
        showToast(
          '현재가 자동 조회에 실패했습니다. 직접 입력할 수 있습니다.',
          'red'
        );
      }
    }

    function selectSearchResult(index) {
      const result = latestSearchResults[index];

      if (!result) {
        return;
      }

      if (result.preset) {
        selectPresetByTicker(result.ticker);
        return;
      }

      const existing = userStocks.find(
        (stock) => stock.ticker === result.ticker
      );

      if (existing) {
        populateStockForm(existing);
      } else {
        clearPriceModelFields();

        document.getElementById(
          'inputName'
        ).value = result.name;

        document.getElementById(
          'inputMarket'
        ).value = result.market;

        document.getElementById(
          'inputTicker'
        ).value = result.ticker;

        document.getElementById(
          'inputCurrentPrice'
        ).value = '';
      }

      document.getElementById(
        'searchResultsDropdown'
      ).classList.add('hidden');

      fetchPriceIntoForm(result.ticker);
    }

    function selectPresetByTicker(ticker) {
      const stock =
        STOCK_DATABASE.find(
          (item) => item.ticker === ticker
        );

      if (!stock) {
        return;
      }

      populateStockForm(stock);

      document.getElementById(
        'searchResultsDropdown'
      ).classList.add('hidden');

      fetchPriceIntoForm(stock.ticker);
    }

    function validateForm(stock) {
      if (
        !Number.isFinite(stock.currentPrice) ||
        stock.currentPrice <= 0
      ) {
        return '현재가는 0보다 큰 숫자여야 합니다.';
      }

      const modelValues = [
        stock.buyZoneLow,
        stock.buyZoneHigh,
        stock.stopLoss,
        stock.fairValue
      ];

      const suppliedCount = modelValues.filter(
        (value) =>
          value !== null &&
          value !== undefined &&
          value !== '' &&
          Number(value) > 0
      ).length;

      if (suppliedCount === 0) {
        return null;
      }

      if (suppliedCount < modelValues.length) {
        return '가격 모델을 입력하려면 손절선, Buy Zone 하단·상단, Base 적정가를 모두 입력하세요.';
      }

      const [
        buyZoneLow,
        buyZoneHigh,
        stopLoss,
        fairValue
      ] = modelValues.map(Number);

      const validPriceOrder =
        stopLoss < buyZoneLow &&
        buyZoneLow <= buyZoneHigh &&
        buyZoneHigh < fairValue;

      if (!validPriceOrder) {
        return '필수 순서: 손절선 < Buy Zone 하단 ≤ 상단 < Base 적정가';
      }

      if (
        stock.baseMetricValue !== null &&
        stock.targetMultipleValue !== null
      ) {
        const calculatedFairValue =
          stock.baseMetricValue *
          stock.targetMultipleValue;

        const difference =
          Math.abs(
            fairValue -
            calculatedFairValue
          ) / calculatedFairValue;

        if (difference > 0.05) {
          return (
            '기초 지표 × 목표 배수' +
            `(${formatKRW(Math.round(calculatedFairValue))})와 ` +
            'Base 적정가 차이가 5%를 넘습니다.'
          );
        }
      }

      return null;
    }

    function handleAddStock(event) {
      event.preventDefault();

      const getElement = (id) => {
        return document.getElementById(id);
      };

      const ticker =
        getElement('inputTicker')
          .value
          .trim()
          .toUpperCase();

      const stock = {
        id: `stock-${ticker}-${Date.now()}`,
        name:
          getElement('inputName')
            .value
            .trim(),
        ticker,
        market:
          getElement('inputMarket').value,
        currentPrice:
          Number(
            getElement('inputCurrentPrice').value
          ),
        dayChangeRate: selectedPriceRate,
        buyZoneLow:
          numberOrNull(
            getElement('inputBuyLow').value
          ),
        buyZoneHigh:
          numberOrNull(
            getElement('inputBuyHigh').value
          ),
        stopLoss:
          numberOrNull(
            getElement('inputStopLoss').value
          ),
        isAiRecommended:
          getElement(
            'inputAiRecommended'
          ).checked,
        inWatchlist: true,
        expanded: false,

        valuation: {
          model:
            getElement('inputModel')
              .value
              .trim() ||
            '분석 대기',
          baseMetricLabel: '기초 지표',
          baseMetricValue:
            numberOrNull(
              getElement('inputBaseMetric').value
            ),
          targetMultipleLabel: '목표 배수',
          targetMultipleValue:
            numberOrNull(
              getElement(
                'inputTargetMultiple'
              ).value
            ),
          fairValue:
            numberOrNull(
              getElement('inputFairValue').value
            ),
          bearValue: null,
          bullValue: null
        },

        entryModel: {
          technicalSupport: null,
          volatilityAdjustment: null,
          techPoint:
            getElement('inputTechPoint')
              .value
              .trim() ||
            '검증된 가격 모델 입력 대기'
        },

        thesis:
          '사용자 등록 종목 — 투자 논리 추가 필요',
        risk:
          '시장·기업 고유 리스크 확인 필요',
        source:
          getElement('inputSource')
            .value
            .trim() ||
          '현재가 API · 가격 모델 미입력',
        asOfDate:
          getElement('inputAsOfDate').value,
        lastCalculatedAt:
          new Date().toISOString(),
        provenanceVerified: false
      };

      const validationError =
        validateForm({
          ...stock,
          ...stock.valuation
        });

      if (validationError) {
        const errorBox =
          getElement('formError');

        errorBox.textContent =
          validationError;

        errorBox.classList.remove('hidden');
        return;
      }

      const existingIndex =
        userStocks.findIndex(
          (item) => item.ticker === ticker
        );

      if (existingIndex >= 0) {
        stock.id =
          userStocks[existingIndex].id;

        userStocks[existingIndex] =
          stock;
      } else {
        userStocks.unshift(stock);
      }

      saveStocks();
      closeAddModal();
      switchMainTab('WATCHLIST');

      showToast(
        existingIndex >= 0
          ? '기존 종목을 새 모델로 교체했습니다.'
          : '종목을 추가했습니다.'
      );

      const shouldAutoAnalyze =
        stock.market === 'KOSPI' ||
        stock.market === 'KOSDAQ' ||
        stock.market === 'ETF';

      const hasManualModel =
        Number(stock.buyZoneLow) > 0 &&
        Number(stock.buyZoneHigh) > 0 &&
        Number(stock.stopLoss) > 0;

      if (shouldAutoAnalyze && !hasManualModel) {
        runTechnicalAnalysis(stock.id);
      }
    }

    async function runTechnicalAnalysis(id, options = {}) {
      const stock = userStocks.find(
        (item) => item.id === id
      );

      if (!stock || !/^[0-9]{6}$/.test(stock.ticker)) {
        showToast(
          '국내 6자리 종목코드만 자동 분석할 수 있습니다.',
          'red'
        );
        return;
      }

      stock.analysisState = 'RUNNING';
      stock.analysisError = null;
      saveStocks();
      renderList();

      try {
        const response = await fetch(
          `/api/analysis?ticker=${encodeURIComponent(stock.ticker)}`,
          { cache: 'no-store' }
        );
        const data = await response.json();

        if (data.status === 'INSUFFICIENT_DATA') {
          stock.analysis = {
            ...data,
            warnings: [data.message]
          };
          stock.analysisState = 'NOT_QUALIFIED';
          stock.isAiRecommended = false;
          saveStocks();
          renderList();

          if (!options.silent) {
            showToast(
              data.message ||
              '분석에 필요한 일봉이 부족합니다.'
            );
          }
          return;
        }

        if (!response.ok || !data.success) {
          throw new Error(
            data.message ||
            data.error ||
            `HTTP ${response.status}`
          );
        }

        stock.analysis = data;
        stock.lastCalculatedAt = new Date(
          data.calculatedAt || Date.now()
        ).toISOString();
        stock.asOfDate =
          data.asOfDate ||
          stock.asOfDate;
        stock.source =
          data.source ||
          stock.source;

        if (data.qualified) {
          stock.buyZoneLow =
            Number(data.buyZoneLow);
          stock.buyZoneHigh =
            Number(data.buyZoneHigh);
          stock.stopLoss =
            Number(data.stopLoss);
          stock.entryModel = {
            technicalSupport:
              data.indicators?.recentLow20 ?? null,
            volatilityAdjustment:
              data.indicators?.atr14 ?? null,
            techPoint:
              (data.reasons || []).join(' · ')
          };
          stock.analysisState = 'READY';
          stock.isAiRecommended =
            Number(data.technicalScore) >= 75 &&
            Number(data.riskReward) >= 2;

          if (!options.silent) {
            showToast(
              data.inBuyZone
                ? 'Buy Zone 진입 조건을 확인했습니다.'
                : '기술적 Buy Zone 분석을 완료했습니다.'
            );
          }
        } else {
          stock.buyZoneLow = null;
          stock.buyZoneHigh = null;
          stock.stopLoss = null;
          stock.analysisState = 'NOT_QUALIFIED';
          stock.isAiRecommended = false;

          if (!options.silent) {
            showToast(
              '현재는 점수·손익비 조건이 부족해 Buy Zone을 확정하지 않았습니다.'
            );
          }
        }
      } catch (error) {
        stock.analysisState = 'ERROR';
        stock.analysisError =
          error.message ||
          '기술분석 API 오류';

        if (!options.silent) {
          showToast(
            '기술분석에 실패했습니다. 잠시 후 다시 시도해주세요.',
            'red'
          );
        }
      }

      saveStocks();
      renderList();
    }

    function isKrxOpen() {
      const parts =
        new Intl.DateTimeFormat(
          'en-US',
          {
            timeZone: 'Asia/Seoul',
            weekday: 'short',
            hour: '2-digit',
            minute: '2-digit',
            hourCycle: 'h23'
          }
        ).formatToParts(new Date());

      const getPart = (type) => {
        return parts.find(
          (part) => part.type === type
        )?.value;
      };

      const weekday = getPart('weekday');

      const minutes =
        Number(getPart('hour')) * 60 +
        Number(getPart('minute'));

      return (
        !['Sat', 'Sun'].includes(weekday) &&
        minutes >= 540 &&
        minutes <= 930
      );
    }

    function setConnectionState(
      state,
      detail = ''
    ) {
      const configurations = {
        LIVE: [
          'bg-emerald-500',
          'text-emerald-400',
          '실시간 연결'
        ],

        DELAYED: [
          'bg-amber-500',
          'text-amber-400',
          '지연/일부 데이터'
        ],

        DISCONNECTED: [
          'bg-rose-500',
          'text-rose-400',
          '연결 끊김'
        ],

        MARKET_CLOSED: [
          'bg-slate-500',
          'text-slate-400',
          '장 마감'
        ]
      };

      const configuration =
        configurations[state];

      document.getElementById(
        'liveDot'
      ).className =
        `relative inline-flex rounded-full h-2 w-2 ${configuration[0]}`;

      document.getElementById(
        'liveStatusText'
      ).className =
        `font-medium ${configuration[1]}`;

      document.getElementById(
        'liveStatusText'
      ).textContent =
        configuration[2] +
        (detail ? ` · ${detail}` : '');

      document.getElementById(
        'livePing'
      ).classList.toggle(
        'hidden',
        state !== 'LIVE'
      );
    }

    async function fetchRealtimePrices() {
      if (!userStocks.length) {
        return;
      }

      const tickers = [
        ...new Set(
          userStocks
            .map((stock) => stock.ticker)
            .filter(Boolean)
        )
      ];

      const controller =
        new AbortController();

      const timeout = setTimeout(() => {
        controller.abort();
      }, API_TIMEOUT_MS);

      try {
        const response = await fetch(
          `/api/prices?tickers=${encodeURIComponent(tickers.join(','))}`,
          {
            signal: controller.signal,
            cache: 'no-store'
          }
        );

        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status}`
          );
        }

        const data =
          await response.json();

        if (
          !data.success ||
          !data.prices
        ) {
          throw new Error(
            'invalid response'
          );
        }

        let updatedCount = 0;

        tickers.forEach((ticker) => {
          const priceInformation =
            data.prices[ticker];

          if (
            priceInformation &&
            priceInformation.success &&
            Number(priceInformation.price) > 0
          ) {
            userStocks
              .filter(
                (stock) =>
                  stock.ticker === ticker
              )
              .forEach((stock) => {
                stock.currentPrice =
                  Number(
                    priceInformation.price
                  );

                stock.dayChangeRate =
                  Number(
                    priceInformation.rate
                  ) || 0;

                stock.priceAsOf =
                  priceInformation.asOf ||
                  priceInformation.timestamp ||
                  new Date().toISOString();
              });

            updatedCount += 1;
          }
        });

        if (!updatedCount) {
          throw new Error(
            'no valid prices'
          );
        }

        lastSuccessfulSync =
          Date.now();

        saveStocks();

        /*
         * 현재가만 직접 바꾸지 않고
         * 카드 전체를 다시 렌더링합니다.
         *
         * 진단, 손익비, 상승여력,
         * Range Bar가 모두 재계산됩니다.
         */
        renderList();

        const isDelayed =
          updatedCount < tickers.length ||
          data.delayed === true;

        if (isKrxOpen()) {
          setConnectionState(
            isDelayed
              ? 'DELAYED'
              : 'LIVE',
            `${updatedCount}/${tickers.length} 종목`
          );
        } else {
          setConnectionState(
            'MARKET_CLOSED',
            `${updatedCount}/${tickers.length} 종목`
          );
        }

        document.getElementById(
          'lastUpdatedTime'
        ).textContent =
          new Date(
            lastSuccessfulSync
          ).toLocaleTimeString(
            'ko-KR',
            {
              timeZone: 'Asia/Seoul',
              hour12: false
            }
          ) + ' KST';

      } catch (error) {
        const recentlyConnected =
          lastSuccessfulSync &&
          Date.now() -
            lastSuccessfulSync <=
            STALE_AFTER_MS;

        setConnectionState(
          recentlyConnected
            ? 'DELAYED'
            : 'DISCONNECTED',
          error.name === 'AbortError'
            ? '응답 시간 초과'
            : 'API 확인 필요'
        );

        if (!lastSuccessfulSync) {
          document.getElementById(
            'lastUpdatedTime'
          ).textContent =
            '마지막 성공 없음';
        }
      } finally {
        clearTimeout(timeout);
      }
    }

    window.addEventListener(
      'DOMContentLoaded',
      () => {
        renderList();
        fetchRealtimePrices();

        setInterval(
          fetchRealtimePrices,
          REFRESH_MS
        );
      }
    );
  </script>
