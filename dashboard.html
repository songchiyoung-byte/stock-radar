  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      50% { opacity: 0.8; transform: scale(0.98); }
    }
    .animate-subtle-pulse {
      animation: subtlePulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes flashRise {
      0% { color: #f43f5e; transform: scale(1.08); }
      100% { color: inherit; transform: scale(1); }
    }
    @keyframes flashFall {
      0% { color: #38bdf8; transform: scale(0.95); }
      100% { color: inherit; transform: scale(1); }

        aiRisk: '이커머스 경쟁 심화',
        provenance: {
          model: 'P/E 밴드 하단',
          baseDate: '2026-09-17',
          targetMultiple: 'PER 15.2x',
          targetPrice: 225000,
          historicalPercentile: '하위 3%',
          riskRewardRatio: '1 : 5.9',
          techAdjustment: '쌍바닥 지지'
        }
      }
    ];

    const DEFAULT_STOCKS = STOCK_KNOWLEDGE_BASE.map(s => ({
      ...s,
      id: 'stock-' + s.ticker,
      status: (s.ticker === '000660' ? 'CART' : 'AI_DISCOVERY'),
      expanded: false
    }));

    let stockData = loadStocks();

    function loadStocks() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return JSON.parse(saved);
      } catch (e) {}
      return DEFAULT_STOCKS;
    }

    function saveStocks() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(stockData));
      } catch (e) {}
    }

    function resetToDefaultData() {
      if (confirm('종목 데이터를 기본 포트폴리오로 재설정하시겠습니까?')) {
        stockData = JSON.parse(JSON.stringify(DEFAULT_STOCKS));
        saveStocks();
        renderTabs();
        renderStockCards();
      }
    }

    function calculateGap(current, high) {
      return ((current - high) / high) * 100;
    }

    function getStockAction(stock) {
      const current = stock.currentPrice;
      const low = stock.buyZoneLow;
      const high = stock.buyZoneHigh;
      const mid = (low + high) / 2;
      const gap = calculateGap(current, high);

      const planStep1 = high;
      const planStep2 = Math.round(mid / 100) * 100;
      const planStop = stock.stopLoss || Math.round((low * 0.97) / 100) * 100;

      if (current < planStop) {
        return {
          gap, isBuyZone: false, isApproaching: false,
          badgeText: '⛔ 진입 중단',
          badgeClass: 'bg-red-500/20 text-red-400 border-red-500/50',
          actionTitle: '매수 중단 (손절선 이탈)',
          actionDesc: `하단 지지선을 이탈했습니다.`,
          step1: planStep1, step2: planStep2, stopPrice: planStop
        };
      }
      if (current <= mid && current >= low) {
        return {
          gap, isBuyZone: true, isApproaching: false,
          badgeText: '🔥 적극 비중확대 (2차)',
          badgeClass: 'bg-emerald-500/25 text-emerald-300 border-emerald-500/60 animate-subtle-pulse',
          actionTitle: '2차 분할 매수 구간',
          actionDesc: `최적의 2차 비중확대 구간입니다.`,
          step1: planStep1, step2: planStep2, stopPrice: planStop
        };
      }
      if (current <= high && current > mid) {
        return {
          gap, isBuyZone: true, isApproaching: false,
          badgeText: '🟢 1차 분할매수 진입',
          badgeClass: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/50 animate-subtle-pulse',
          actionTitle: '1차 분할 매수 진입',
          actionDesc: `Buy Zone 상단에 들어왔습니다. 목표 비중의 30%를 진입하세요.`,
          step1: planStep1, step2: planStep2, stopPrice: planStop
        };
      }
      if (gap <= 3.0 && gap > 0) {
        return {
          gap, isBuyZone: false, isApproaching: true,
          badgeText: `⚡ 진입 대기 (+${gap.toFixed(2)}%)`,
          badgeClass: 'bg-amber-500/20 text-amber-300 border-amber-500/50',
          actionTitle: '매수 대기',
          actionDesc: `밴드 진입을 기다리세요.`,
          step1: planStep1, step2: planStep2, stopPrice: planStop
        };
      }
      return {
        gap, isBuyZone: false, isApproaching: false,
        badgeText: `관망 (+${gap.toFixed(2)}%)`,
        badgeClass: 'bg-gray-800 border-gray-700 text-gray-400',
        actionTitle: '관망 및 가격 조정 대기',
        actionDesc: `시스템 적정 매수가보다 ${gap.toFixed(1)}% 비쌉니다. 관찰 대기합니다.`,
        step1: planStep1, step2: planStep2, stopPrice: planStop
      };
    }

    function matchFilter(stock, filterId) {
      const action = getStockAction(stock);
      switch (filterId) {
        case 'ALL': return true;
        case 'BUY_ZONE': return action.isBuyZone;
        case 'APPROACHING': return action.isApproaching;
        case 'AI_DISCOVERY': return action.isBuyZone || (action.isApproaching && Math.abs(action.gap) <= 2.5);
        case 'CART': return stock.status === 'CART';
        case 'HOLDING': return stock.status === 'HOLDING';
        default: return true;
      }
    }

    function formatKRW(val) {
      return Number(val).toLocaleString('ko-KR') + '원';
    }

    function renderTabs() {
      const container = document.getElementById('filterTabs');
      const counts = {
        ALL: stockData.length,
        BUY_ZONE: stockData.filter(s => getStockAction(s).isBuyZone).length,
        APPROACHING: stockData.filter(s => getStockAction(s).isApproaching).length,
        AI_DISCOVERY: stockData.filter(s => matchFilter(s, 'AI_DISCOVERY')).length,
        CART: stockData.filter(s => s.status === 'CART').length,
        HOLDING: stockData.filter(s => s.status === 'HOLDING').length
      };

      document.getElementById('statTotal').innerText = counts.ALL;
      document.getElementById('statBuyZone').innerText = counts.BUY_ZONE;
      document.getElementById('statApproaching').innerText = counts.APPROACHING;

      container.innerHTML = FILTERS.map(tab => {
        const isActive = currentFilter === tab.id;
        const count = counts[tab.id] || 0;
        let activeClass = isActive 
          ? 'bg-blue-600 text-white font-bold shadow-md border-blue-500' 
          : 'bg-finCard text-gray-400 hover:text-gray-200 border-finBorder';
        return `
          <button onclick="setFilter('${tab.id}')" class="whitespace-nowrap px-3 py-1.5 rounded-full border text-xs flex items-center gap-1.5 transition-all ${activeClass}">
            <span>${tab.label}</span>
            <span class="text-[10px] px-1.5 py-0.2 rounded-full font-bold bg-gray-700/80 text-gray-300">${count}</span>
          </button>
        `;
      }).join('');
    }

    function setFilter(id) {
      currentFilter = id;
      renderTabs();
      renderStockCards();
    }

    function renderStockCards() {
      const container = document.getElementById('stockListContainer');
      const emptyState = document.getElementById('emptyState');
      const filtered = stockData.filter(s => matchFilter(s, currentFilter));

      if (filtered.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
        return;
      }
      emptyState.classList.add('hidden');
      emptyState.classList.remove('flex');

      container.innerHTML = filtered.map(stock => {
        const action = getStockAction(stock);
        const isUp = (stock.dayChangeRate || 0) > 0;
        const changeColor = isUp ? 'text-rose-400' : 'text-blue-400';
        const changeSign = isUp ? '+' : '';

        return `
          <div class="bg-finCard rounded-xl border border-finBorder p-4 shadow-xl relative">
            <div class="flex items-start justify-between">
              <div>
                <div class="flex items-center gap-2">
                  <h3 class="text-base font-bold text-white">${stock.name}</h3>
                  <span class="text-[11px] font-mono text-gray-400">${stock.ticker}</span>
                  <span class="text-[9px] px-1.5 py-0.2 rounded bg-gray-700 text-gray-300">${stock.market}</span>
                </div>
                <div class="flex items-baseline gap-2 mt-1">
                  <span id="price-${stock.ticker}" class="text-xl font-extrabold text-white font-mono">${formatKRW(stock.currentPrice)}</span>
                  <span id="change-${stock.ticker}" class="text-xs font-semibold ${changeColor}">${changeSign}${(stock.dayChangeRate || 0).toFixed(2)}%</span>
                </div>
              </div>
              <div class="px-2.5 py-1 rounded-full border text-xs font-bold ${action.badgeClass}">
                ${action.badgeText}
              </div>
            </div>

            <div class="mt-2.5 pt-2 border-t border-gray-700/60 flex justify-between text-[11px]">
              <span class="text-gray-400">System Buy Zone</span>
              <span class="text-emerald-400 font-semibold">${formatKRW(stock.buyZoneLow)} ~ ${formatKRW(stock.buyZoneHigh)}</span>
            </div>

            <div class="mt-3 bg-gray-900/90 rounded-lg p-3 border border-gray-700/80 space-y-1.5 text-xs">
              <div class="font-bold text-gray-200">${action.actionTitle}</div>
              <div class="text-[11px] text-gray-400 leading-relaxed">${action.actionDesc}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    let isRealtimeRunning = true;
    let realtimeTimer = null;

    function toggleRealtimeEngine() {
      isRealtimeRunning = !isRealtimeRunning;
      const btn = document.getElementById('btnToggleLive');
      const text = document.getElementById('liveStatusText');
      if (btn) btn.textContent = isRealtimeRunning ? '일시정지' : '시세 재개';
      if (text) text.textContent = isRealtimeRunning ? '실시간 시세 연동 중' : '시세 일시정지됨';
    }

    async function fetchRealtimePrices() {
      if (!isRealtimeRunning || stockData.length === 0) return;

      const tickers = stockData.map(s => s.ticker).filter(Boolean);

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 6000);
        const res = await fetch(`/api/prices?tickers=${tickers.join(',')}`, { signal: controller.signal });
        clearTimeout(timeoutId);

        if (res.ok) {
          const data = await res.json();
          if (data.success && data.prices) {
            const statusEl = document.getElementById('liveStatusText');
            if (statusEl && isRealtimeRunning) {
              statusEl.textContent = '🟢 실시간 증권 거래소 연동 (Live)';
              statusEl.className = 'font-medium text-emerald-400';
            }

            tickers.forEach(ticker => {
              const info = data.prices[ticker];
              if (info && info.success && info.price > 0) {
                updateStockPriceInRuntime(ticker, info.price, info.diff, info.rate);
              }
            });
            updateTimestamp();
            return;
          }
        }
      } catch (err) {
        console.warn('Price fetch error:', err);
      }

      const statusEl = document.getElementById('liveStatusText');
      if (statusEl && isRealtimeRunning) {
        statusEl.textContent = '⚠️ 시세 서버 응답 대기 중';
        statusEl.className = 'font-medium text-amber-400';
      }
      updateTimestamp();
    }

    function updateStockPriceInRuntime(ticker, newPrice, diff, rate) {
      const stock = stockData.find(s => s.ticker === ticker);
      if (!stock) return;

      const oldPrice = stock.currentPrice;
      stock.currentPrice = newPrice;
      stock.dayChange = diff;
      stock.dayChangeRate = rate;

      const priceEl = document.getElementById(`price-${stock.ticker}`);
      if (priceEl) {
        priceEl.textContent = formatKRW(newPrice);
        priceEl.classList.remove('flash-rise', 'flash-fall');
        void priceEl.offsetWidth;
        if (newPrice > oldPrice) priceEl.classList.add('flash-rise');
        else if (newPrice < oldPrice) priceEl.classList.add('flash-fall');
      }

      const changeEl = document.getElementById(`change-${stock.ticker}`);
      if (changeEl) {
        const isUp = (stock.dayChangeRate || 0) > 0;
        const changeColor = isUp ? 'text-rose-400' : 'text-blue-400';
        const changeSign = isUp ? '+' : '';
        changeEl.className = `text-xs font-semibold ${changeColor}`;
        changeEl.innerHTML = `${changeSign}${(stock.dayChangeRate || 0).toFixed(2)}%`;
      }

      saveStocks();
      renderTabs();
    }

    function updateTimestamp() {
      const now = new Date();
      const timeEl = document.getElementById('lastUpdatedTime');
      if (timeEl) timeEl.textContent = `${now.toTimeString().split(' ')[0]} 갱신`;
    }

    function initRealtimeEngine() {
      if (realtimeTimer) clearInterval(realtimeTimer);
      realtimeTimer = setInterval(fetchRealtimePrices, 5000);
      fetchRealtimePrices();
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderTabs();
      renderStockCards();
      initRealtimeEngine();
    });
  </script>
</body>
</html>
