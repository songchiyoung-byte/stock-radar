<!DOCTYPE html>
<html lang="ko" class="dark">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            finBackground: '#111827',
            finCard: '#1F2937',
            finCardHover: '#283548',
            finBorder: '#374151',
            finEmerald: '#10B981',
            finAmber: '#F59E0B',
            finRose: '#F43F5E',
            finCyan: '#06B6D4'
          },
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes subtlePulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(0.98); }
    }
    .animate-subtle-pulse {
      animation: subtlePulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  
    @keyframes flashRise {
      0% { color: #f43f5e; transform: scale(1.08); }
      100% { color: inherit; transform: scale(1); }
    }
    @keyframes flashFall {
      0% { color: #38bdf8; transform: scale(0.95); }
      100% { color: inherit; transform: scale(1); }
    }
    .flash-rise { animation: flashRise 0.8s ease-out; }
    .flash-fall { animation: flashFall 0.8s ease-out; }

  </style>
</head>
<body class="bg-finBackground text-gray-100 min-h-screen flex flex-col font-sans antialiased selection:bg-rose-500 selection:text-white">

  <!-- Floating Toast Notifications -->

  <!-- Mobile Screen Container: max-w-md -->
  <div class="w-full max-w-md mx-auto flex-1 flex flex-col pb-28 shadow-2xl relative border-x border-gray-800/60 bg-finBackground">

    <!-- Sticky Header -->
    <header class="sticky top-0 z-30 bg-finBackground/95 backdrop-blur-md px-4 pt-3.5 pb-2 border-b border-finBorder">
      <div class="flex items-center justify-between mb-2.5">
        <div class="flex items-center space-x-2">
          <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-rose-500 via-amber-500 to-emerald-500 flex items-center justify-center shadow-lg shadow-rose-500/20">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
            </svg>
          </div>
          <div>
            <h1 class="text-base font-bold tracking-tight text-white flex items-center gap-1.5">
              Buy Zone Radar
              <span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">ACTION PRO</span>
            </h1>
            <p class="text-[10px] text-gray-400">국내 우량주 & 글로벌 대표 지수 ETF 분할 매수</p>
          </div>
        </div>

        <div class="flex items-center gap-1.5">
          <!-- Reset Data Button -->
          <button onclick="resetToDefaultData()" title="기본 종목으로 재설정" class="p-1.5 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-400 hover:text-gray-200 text-xs border border-gray-700 transition">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
            </svg>
          </button>

          <!-- Add Button -->
          <button onclick="openAddModal()" class="flex items-center gap-1 px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-xs font-semibold text-white shadow-md shadow-blue-600/30 active:scale-95 transition-all">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
            <span>종목/ETF 검색</span>
          </button>
        </div>
      </div>

      <!-- Live Metric Bar -->
      <div class="grid grid-cols-3 gap-1.5 py-2 px-2.5 rounded-lg bg-finCard border border-finBorder text-center">
        <div>
          <span class="text-[10px] text-gray-400 block">전체 감시</span>
          <span id="statTotal" class="text-sm font-bold text-gray-100">0</span>
        </div>
        <div class="border-x border-gray-700">
          <span class="text-[10px] text-emerald-400 font-medium block">🎯 1~2차 매수 구간</span>
          <span id="statBuyZone" class="text-sm font-bold text-emerald-400">0</span>
        </div>
        <div>
          <span class="text-[10px] text-amber-400 font-medium block">⚡ 근접 대기</span>
          <span id="statApproaching" class="text-sm font-bold text-amber-400">0</span>
        </div>
      </div>

      
      <!-- Live Realtime Engine & AI Radar Status Ribbon -->
      <div class="flex items-center justify-between mt-2 px-2.5 py-1.5 rounded-lg bg-gray-900/90 border border-gray-800 text-[11px]">
        <div class="flex items-center gap-1.5">
          <span class="relative flex h-2 w-2">
            <span id="livePulsePing" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span id="livePulseDot" class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
          </span>
          <span id="liveStatusText" class="font-medium text-emerald-400">실시간 시세 자동 갱신 중</span>
        </div>
        <div class="flex items-center gap-2">
          <span id="lastUpdatedTime" class="text-[10px] text-gray-400 font-mono">방금 전</span>
          <button onclick="toggleRealtimeEngine()" id="btnToggleLive" class="px-2 py-0.5 rounded bg-gray-800 hover:bg-gray-700 text-gray-300 text-[10px] border border-gray-700 transition">
            일시정지
          </button>
        </div>
      </div>

      <!-- Filter Tabs -->
      <nav class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pt-2.5 pb-1 -mx-4 px-4 text-xs font-medium" id="filterTabs"></nav>
    </header>

    <!-- Main Stock List -->
    <main class="flex-1 px-4 py-3 space-y-3.5" id="stockListContainer"></main>

    <!-- Empty State -->
    <div id="emptyState" class="hidden flex-col items-center justify-center py-16 px-4 text-center">
      <div class="w-14 h-14 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center text-gray-500 mb-3">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
        </svg>
      </div>
      <h3 class="text-sm font-medium text-gray-300">해당 필터에 속한 종목이 없습니다</h3>
      <p class="text-xs text-gray-500 mt-1">상태 필터를 변경하거나 우측 상단에서 새 종목/ETF를 검색해 추가해 보세요.</p>
    </div>
  </div>

  <!-- SMART AUTO-FILL ADD MODAL (종목명/티커 검색 모두 지원) -->
  <div id="addModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-finCard w-full max-w-md rounded-t-2xl sm:rounded-2xl border border-finBorder p-5 max-h-[92vh] overflow-y-auto shadow-2xl">
      
      <div class="flex items-center justify-between pb-3 border-b border-gray-700 mb-3.5">
        <h2 class="text-base font-bold text-white flex items-center gap-2">
          <span class="w-5 h-5 rounded bg-blue-500/20 text-blue-400 flex items-center justify-center text-xs font-bold">🔍</span>
          종목 & ETF 검색 자동 완성
        </h2>
        <button onclick="closeAddModal()" class="text-gray-400 hover:text-white p-1">✕</button>
      </div>

      <!-- Smart Search Bar -->
      <div class="mb-4 bg-gray-900/90 rounded-xl p-3 border border-blue-500/30">
        <label class="block text-[11px] font-bold text-blue-400 mb-1.5 flex items-center justify-between">
          <span>⚡ 종목명, 영문, 또는 티커(6자리) 검색</span>
          <span class="text-[9px] text-gray-400 font-normal">ETF(S&P500 등) 완벽 지원</span>
        </label>
        
        <div class="relative">
          <input type="text" id="smartSearchInput" oninput="handleSmartSearch(this.value)" placeholder="예: tiger, s&p500, 360750, 카카오, 나스닥..." class="w-full bg-gray-950 border border-gray-700 rounded-lg pl-8 pr-3 py-2 text-xs text-white placeholder-gray-500 focus:border-blue-500 focus:outline-none">
          <svg class="w-4 h-4 text-gray-400 absolute left-2.5 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </div>

        <div id="searchResultsDropdown" class="hidden mt-1.5 max-h-48 overflow-y-auto rounded-lg bg-gray-950 border border-gray-700 divide-y divide-gray-800 text-xs"></div>

        <!-- Quick Pick Keyword Pills (ETF 포함) -->
        <div class="mt-2.5">
          <span class="text-[10px] text-gray-400 block mb-1">인기 종목 및 ETF 원클릭 선택:</span>
          <div class="flex flex-wrap gap-1" id="quickPills"></div>
        </div>

        <div id="autoFillSuccessAlert" class="hidden mt-2 p-1.5 rounded bg-emerald-500/20 border border-emerald-500/40 text-[11px] text-emerald-300 items-center gap-1">
          <span>✨</span>
          <span id="autoFillAlertText"></span>
        </div>
      </div>

      <!-- Detail Form -->
      <form id="addStockForm" onsubmit="handleAddStock(event)" class="space-y-3 text-xs">
        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="block text-gray-400 mb-1">종목명 *</label>
            <input type="text" id="inputName" required placeholder="예: TIGER 미국S&P500" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white focus:border-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-gray-400 mb-1">티커코드 (6자리) *</label>
            <input type="text" id="inputTicker" oninput="handleTickerDirectInput(this.value)" required placeholder="예: 360750" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white focus:border-blue-500 focus:outline-none font-mono">
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="block text-gray-400 mb-1">현재가 (원) *</label>
            <input type="number" id="inputCurrentPrice" onchange="autoCalculateIfCustom()" required placeholder="26280" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-2.5 py-2 text-white focus:border-blue-500 focus:outline-none">

          <div>
            <label class="block text-emerald-400 mb-1">Buy Zone 상단 *</label>
            <input type="number" id="inputBuyHigh" required placeholder="25900" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-2.5 py-2 text-white focus:border-blue-500 focus:outline-none">
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="block text-rose-400 mb-1">손절선(스탑) *</label>
            <input type="number" id="inputStopLoss" required placeholder="23500" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-2.5 py-2 text-white focus:border-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-gray-400 mb-1">시장 구분</label>
            <select id="inputMarket" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-2.5 py-2 text-white focus:border-blue-500 focus:outline-none">
              <option value="ETF">ETF (상장지수펀드)</option>
              <option value="KOSPI">KOSPI</option>
              <option value="KOSDAQ">KOSDAQ</option>
            </select>
          </div>
          <div>
            <label class="block text-gray-400 mb-1">분류 상태</label>
            <select id="inputStatus" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-2.5 py-2 text-white focus:border-blue-500 focus:outline-none">
              <option value="CART">내 장바구니</option>
              <option value="AI_DISCOVERY">AI 발굴</option>
              <option value="HOLDING">보유 중</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-gray-400 mb-1">💡 AI 선정 이유 (1줄)</label>
          <input type="text" id="inputAiReason" required placeholder="예: 미국 500대 우량주 분산 투자 및 달러 자산 우상향 핵심 코어" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white focus:border-blue-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-gray-400 mb-1">⚠️ 핵심 리스크 (1줄)</label>
          <input type="text" id="inputAiRisk" required placeholder="예: 미국 경기 둔화 우려 및 원/달러 환율 급락에 따른 환차손" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white focus:border-blue-500 focus:outline-none">
        </div>

        <div class="pt-2 border-t border-gray-700/70">
          <p class="text-[11px] font-semibold text-gray-300 mb-1.5">산출 근거 (Provenance) 파라미터</p>
          <div class="space-y-2">
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-gray-400 mb-0.5">적용 모델</label>
                <input type="text" id="inputModel" placeholder="예: 120일선 지수 이격도 모델" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-white">
              </div>
              <div>
                <label class="block text-emerald-400 mb-0.5">상승 목표가 (원)</label>
                <input type="number" id="inputTargetPrice" placeholder="예: 31000" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-white">
              </div>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-gray-400 mb-0.5">Target 배수/지표</label>
                <input type="text" id="inputTargetMultiple" placeholder="예: S&P500 Fwd PER 19.5x" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-white">
              </div>
              <div>
                <label class="block text-gray-400 mb-0.5">기술적 보정치</label>
                <input type="text" id="inputTechAdjustment" placeholder="예: 고점 대비 -5% 눌림목" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-white">
              </div>
            </div>
          </div>
        </div>

        <div class="flex items-center gap-2 pt-2">
          <button type="button" onclick="closeAddModal()" class="flex-1 py-2.5 rounded-lg bg-gray-700 hover:bg-gray-600 text-gray-300 font-semibold transition">취소</button>
          <button type="submit" class="flex-1 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-semibold transition shadow-lg shadow-blue-600/30">종목 추가하기</button>
        </div>
      </form>
    </div>
  </div>

          badgeClass: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/50 animate-subtle-pulse',
          actionTitle: '1차 분할 매수 진입 (비중 30% 발담그기)',
          actionDesc: `Buy Zone 상단에 들어왔습니다. 혹시 모를 추가 하락에 대비해 목표 비중의 30%만 가볍게 진입하세요.`,
          step1: planStep1,
          step2: planStep2,
          stopPrice: planStop
        };
      }

      if (gap <= 3.0 && gap > 0) {
        return {
          gap,
          isBuyZone: false,
          isApproaching: true,
          signalType: 'APPROACHING',
          badgeText: `⚡ 진입 대기 (+${gap.toFixed(2)}%)`,
          badgeClass: 'bg-amber-500/20 text-amber-300 border-amber-500/50',
          actionTitle: '매수 대기 (1~2호가 근접)',
          actionDesc: `상단가(${high.toLocaleString()}원)까지 ${gap.toFixed(1)}% 남았습니다. 섣불리 추격 매수하지 말고 밴드 진입을 기다리세요.`,
          step1: planStep1,
          step2: planStep2,
          stopPrice: planStop
        };
      }

      return {
        gap,
        isBuyZone: false,
        isApproaching: false,
        signalType: 'WAITING',
        badgeText: `관망 (+${gap.toFixed(2)}%)`,
        badgeClass: 'bg-gray-800 border-gray-700 text-gray-400',
        actionTitle: '관망 및 가격 조정 대기',
        actionDesc: `아직 시스템 적정 매수가보다 ${gap.toFixed(1)}% 비쌉니다. 매수를 보류하고 관찰 장바구니에 대기시킵니다.`,
        step1: planStep1,
        step2: planStep2,
        stopPrice: planStop
      };
    }

    function matchFilter(stock, filterId) {
      const action = getStockAction(stock);
      switch (filterId) {
        case 'ALL': return true;
        case 'BUY_ZONE': return action.isBuyZone;
        case 'APPROACHING': return action.isApproaching;
        case 'AI_DISCOVERY': 
          // AI 발굴 레이더: 현재가가 System Buy Zone에 진입했거나(1~2차 매수 구간) 2.5% 이내 초근접한 매수 적기 종목만 포착!
          return action.isBuyZone || (action.isApproaching && Math.abs(action.gap) <= 2.5);
        case 'CART': return stock.status === 'CART';
        case 'HOLDING': return stock.status === 'HOLDING';
        default: return true;
      }
    }

    function formatKRW(val) {
      return Number(val).toLocaleString('ko-KR') + '원';
    }

    function renderTabs() {
      const container = document.getElementById('filterTabs');
      const counts = {
        ALL: stockData.length,
        BUY_ZONE: stockData.filter(s => getStockAction(s).isBuyZone).length,
        APPROACHING: stockData.filter(s => getStockAction(s).isApproaching).length,
        AI_DISCOVERY: stockData.filter(s => matchFilter(s, 'AI_DISCOVERY')).length,
        CART: stockData.filter(s => s.status === 'CART').length,
        HOLDING: stockData.filter(s => s.status === 'HOLDING').length
      };

      document.getElementById('statTotal').innerText = counts.ALL;
      document.getElementById('statBuyZone').innerText = counts.BUY_ZONE;
      document.getElementById('statApproaching').innerText = counts.APPROACHING;

      container.innerHTML = FILTERS.map(tab => {
        const isActive = currentFilter === tab.id;
        const count = counts[tab.id] || 0;
        let activeClass = isActive 
          ? 'bg-blue-600 text-white font-bold shadow-md shadow-blue-600/30 border-blue-500' 
          : 'bg-finCard text-gray-400 hover:text-gray-200 border-finBorder hover:border-gray-600';

        let badgeColor = 'bg-gray-700/80 text-gray-300';
        if (tab.id === 'BUY_ZONE') {
          badgeColor = isActive ? 'bg-emerald-500 text-white' : 'bg-emerald-500/20 text-emerald-400';
        } else if (tab.id === 'APPROACHING') {
          badgeColor = isActive ? 'bg-amber-500 text-white' : 'bg-amber-500/20 text-amber-400';
        }

        return `
          <button onclick="setFilter('${tab.id}')" class="whitespace-nowrap px-3 py-1.5 rounded-full border text-xs flex items-center gap-1.5 transition-all active:scale-95 ${activeClass}">
            <span>${tab.label}</span>
            <span class="text-[10px] px-1.5 py-0.2 rounded-full font-bold ${badgeColor}">${count}</span>
          </button>
        `;
      }).join('');
    }

    function setFilter(filterId) {
      currentFilter = filterId;
      renderTabs();
      renderStockCards();
    }

    function toggleProvenance(id) {
      const target = stockData.find(s => s.id === id);
      if (target) {
        target.expanded = !target.expanded;
        saveStocks();
        renderStockCards();
      }
    }

    function updateStockStatus(id, newStatus) {
      const target = stockData.find(s => s.id === id);
      if (target) {
        target.status = newStatus;
        saveStocks();
        renderTabs();
        renderStockCards();
      }
    }

    function deleteStock(id) {
      const target = stockData.find(s => s.id === id);
      if (!target) return;

      const action = getStockAction(target);

      if (target.status === 'CART') {
        if (action.isBuyZone || action.isApproaching) {
          const moveConfirmed = confirm(
            `'${target.name}'은(는) 현재 [${action.badgeText}] 상태인 유망 종목입니다.\n\n내 장바구니에서 제외하고 [AI 발굴] 리스트로 보관 이동하시겠습니까?\n\n- [확인]: 'AI 발굴' 탭으로 이동\n- [취소]: 완전 영구 삭제 여부 확인`
          );

          if (moveConfirmed) {
            target.status = 'AI_DISCOVERY';
            saveStocks();
            renderTabs();
            renderStockCards();
            alert(`'${target.name}' 종목이 [AI 발굴] 탭으로 안전하게 이동되었습니다.`);
            return;
          }
        }
      }

      if (confirm(`'${target.name}' 종목을 대시보드에서 완전히 삭제하시겠습니까?`)) {
        stockData = stockData.filter(s => s.id !== id);
        saveStocks();
        renderTabs();
        renderStockCards();
      }
    }

    function generatePriceGaugeHTML(stock, action) {
      const minScale = Math.min(stock.buyZoneLow * 0.94, stock.currentPrice * 0.97);
      const maxScale = Math.max(stock.buyZoneHigh * 1.06, stock.currentPrice * 1.03);
      const totalSpan = maxScale - minScale;

      const buyLowPercent = Math.max(0, Math.min(100, ((stock.buyZoneLow - minScale) / totalSpan) * 100));
      const buyHighPercent = Math.max(0, Math.min(100, ((stock.buyZoneHigh - minScale) / totalSpan) * 100));
      const currentPercent = Math.max(2, Math.min(98, ((stock.currentPrice - minScale) / totalSpan) * 100));
      const buyWidth = buyHighPercent - buyLowPercent;

      let markerColor = 'bg-blue-400 border-blue-200';
      let pingEffect = '';
      if (action.isBuyZone) {
        markerColor = 'bg-emerald-400 border-white';
        pingEffect = '<span class="absolute -top-1 -left-1 w-4 h-4 rounded-full bg-emerald-400/60 animate-ping"></span>';
      } else if (action.isApproaching) {
        markerColor = 'bg-amber-400 border-amber-200';
        pingEffect = '<span class="absolute -top-1 -left-1 w-4 h-4 rounded-full bg-amber-400/60 animate-ping"></span>';
      }

      return `
        <div class="mt-2.5 pt-2 border-t border-gray-700/60">
          <div class="flex items-center justify-between text-[11px] mb-1">
            <span class="text-gray-400 flex items-center gap-1 font-medium">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
              System Buy Zone
            </span>
            <span class="text-emerald-400 font-semibold tracking-wide">${Number(stock.buyZoneLow).toLocaleString()} ~ ${Number(stock.buyZoneHigh).toLocaleString()}원</span>
          </div>

          <div class="relative w-full h-3 bg-gray-900 rounded-full overflow-hidden border border-gray-700/80 my-2">
            <div class="absolute top-0 bottom-0 bg-gradient-to-r from-emerald-500/30 via-emerald-400/45 to-emerald-500/30 border-x border-emerald-500/70"
                 style="left: ${buyLowPercent}%; width: ${buyWidth}%;"></div>
            
            <div class="absolute top-0 bottom-0 flex items-center justify-center -ml-1.5" style="left: ${currentPercent}%;">
              <div class="relative w-3 h-3 rounded-full ${markerColor} border-2 shadow-lg">
                ${pingEffect}
              </div>
            </div>
          </div>

          <div class="flex justify-between items-center text-[10px] text-gray-500">
            <span>하단 ${Number(stock.buyZoneLow).toLocaleString()}</span>
            <span class="${action.isBuyZone ? 'text-emerald-400 font-bold' : (action.isApproaching ? 'text-amber-400 font-bold' : 'text-gray-400')}">
              현재가 위치 ${currentPercent.toFixed(0)}%
            </span>
            <span>상단 ${Number(stock.buyZoneHigh).toLocaleString()}</span>
          </div>
        </div>
      `;
    }

    function renderStockCards() {
      const container = document.getElementById('stockListContainer');
      const emptyState = document.getElementById('emptyState');
      const filtered = stockData.filter(s => matchFilter(s, currentFilter));

      if (filtered.length === 0) {
        if (currentFilter === 'AI_DISCOVERY') {
          container.innerHTML = `
            <div class="p-8 text-center bg-finCard rounded-xl border border-finBorder space-y-3">
              <div class="w-12 h-12 rounded-full bg-indigo-500/20 text-indigo-400 mx-auto flex items-center justify-center text-xl">🤖</div>
              <h3 class="text-sm font-bold text-white">발굴된 유망 종목이 모두 장바구니에 담겼습니다!</h3>
              <p class="text-xs text-gray-400">새로운 유망 종목을 다시 스크리닝하거나 초기화하려면 아래 버튼을 누르세요.</p>
              <button onclick="reloadAiPicks()" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-xs font-bold text-white shadow transition">
                AI 추천 종목 5종 다시 채우기
              </button>
            </div>
          `;
          emptyState.classList.add('hidden');
          emptyState.classList.remove('flex');
          return;
        }
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
        return;
      }

      emptyState.classList.add('hidden');
      emptyState.classList.remove('flex');

      let radarBannerHTML = '';
      if (currentFilter === 'AI_DISCOVERY') {
        radarBannerHTML = `
          <div class="mb-3.5 p-3.5 rounded-xl bg-gradient-to-r from-indigo-950/70 via-purple-950/50 to-finCard border border-indigo-500/40 shadow-xl relative overflow-hidden">

              <span class="text-xs font-bold text-indigo-300 flex items-center gap-1.5">
                <span class="relative flex h-2 w-2">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2 w-2 bg-indigo-500"></span>
                </span>
                🎯 AI 실시간 매수 타이밍 포착 레이더
              </span>
              <button onclick="reloadAiPicks()" class="px-2 py-0.5 rounded bg-indigo-600/30 hover:bg-indigo-600/50 text-[10px] text-indigo-200 border border-indigo-500/30 font-semibold transition">
                새로고침
              </button>
            </div>
            <p class="text-[11px] text-gray-300 leading-relaxed">
              현재 코스피·코스닥 우량주 중 <b class="text-emerald-400">System Buy Zone(안전마진 밴드)에 실제로 진입했거나 2% 이내로 초근접</b>하여 즉시 분할 매수가 가능한 매수 적기 종목들만 실시간으로 엄선해 표출합니다. (고점 과열 및 추격 매수 구간 종목은 자동 제외됩니다.)
            </p>
          </div>
        `;
      }

      container.innerHTML = radarBannerHTML + filtered.map(stock => {
        const action = getStockAction(stock);
        const isUp = (stock.dayChangeRate || 0) > 0;
        const changeColor = isUp ? 'text-rose-400' : 'text-blue-400';
        const changeSign = isUp ? '+' : '';

        const targetPrice = stock.provenance.targetPrice || Math.round(stock.buyZoneHigh * 1.25);
        const upsideRate = (((targetPrice - stock.currentPrice) / stock.currentPrice) * 100).toFixed(1);

        return `
          <div class="bg-finCard rounded-xl border border-finBorder p-4 shadow-xl transition-all hover:border-gray-600 relative overflow-hidden">
            
            <div class="flex items-start justify-between">
              <div>
                <div class="flex items-center gap-2">
                  <h3 class="text-base font-bold text-white tracking-tight">${stock.name}</h3>
                  <span class="text-[11px] font-mono text-gray-400">${stock.ticker}</span>
                  <span class="text-[9px] px-1.5 py-0.2 rounded ${stock.market === 'ETF' ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/30' : 'bg-gray-700/70 text-gray-300'} font-medium">${stock.market}</span>
                </div>
                
                <div class="flex items-baseline gap-2 mt-1">
                  <span id="price-${stock.ticker}" class="text-xl font-extrabold text-white tracking-tight transition-all duration-300 font-mono">${formatKRW(stock.currentPrice)}</span>
                  <span id="change-${stock.ticker}" class="text-xs font-semibold ${changeColor}">${changeSign}${(stock.dayChangeRate || 0).toFixed(2)}%</span>
                </div>
              </div>

              <div class="flex flex-col items-end gap-1.5">
                <div class="px-2.5 py-1 rounded-full border text-xs font-bold ${action.badgeClass} flex items-center gap-1">
                  <span>${action.badgeText}</span>
                </div>

                <div class="flex items-center gap-1.5 mt-0.5">
                  <select onchange="updateStockStatus('${stock.id}', this.value)" class="bg-gray-900/90 text-gray-300 text-[10px] font-medium border border-gray-700 rounded px-1.5 py-0.5 focus:outline-none focus:border-blue-500">
                    <option value="CART" ${stock.status === 'CART' ? 'selected' : ''}>내 장바구니</option>
                    <option value="AI_DISCOVERY" ${stock.status === 'AI_DISCOVERY' ? 'selected' : ''}>AI 발굴</option>
                    <option value="HOLDING" ${stock.status === 'HOLDING' ? 'selected' : ''}>보유 중</option>
                  </select>

                  <button onclick="deleteStock('${stock.id}')" title="삭제 또는 보관 이동" class="p-1 rounded text-gray-500 hover:text-rose-400 hover:bg-gray-800 transition">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                    </svg>
                  </button>
                </div>
              </div>
            </div>

            ${generatePriceGaugeHTML(stock, action)}

            <!-- AI 실행 지침 & 분할 매수 계획표 -->
            <div class="mt-3 bg-gray-900/90 rounded-lg p-3 border border-gray-700/80 space-y-2">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-gray-200 flex items-center gap-1.5">
                  <span class="text-blue-400">⚡ AI 실행 지침:</span>
                  <span class="${action.isBuyZone ? 'text-emerald-400' : (action.isApproaching ? 'text-amber-400' : 'text-gray-300')}">${action.actionTitle}</span>
                </span>
                <span class="text-[10px] px-2 py-0.5 rounded bg-blue-500/20 text-blue-300 font-bold">적합도 ${stock.aiScore || 80}점</span>
              </div>
              <p class="text-[11px] text-gray-400 leading-relaxed">${action.actionDesc}</p>

              <div class="grid grid-cols-3 gap-1.5 pt-2 border-t border-gray-800 text-[10px] text-center">
                <div class="bg-gray-800/80 rounded p-1.5 border border-gray-700/60">
                  <span class="text-gray-400 block text-[9px]">1차 분할(30%)</span>
                  <span class="font-bold text-emerald-400">${Number(action.step1).toLocaleString()}원</span>
                </div>
                <div class="bg-gray-800/80 rounded p-1.5 border border-gray-700/60">
                  <span class="text-gray-400 block text-[9px]">2차 가중(40%)</span>
                  <span class="font-bold text-cyan-400">${Number(action.step2).toLocaleString()}원</span>
                </div>
                <div class="bg-gray-800/80 rounded p-1.5 border border-gray-700/60">
                  <span class="text-rose-400/90 block text-[9px]">손절선/중단</span>
                  <span class="font-bold text-rose-400">${Number(action.stopPrice).toLocaleString()}원</span>
                </div>
              </div>
            </div>

            <!-- AI Research 1-Line Summary -->
            <div class="mt-2.5 bg-gray-900/60 rounded-lg p-2.5 border border-gray-800 text-[11px] space-y-1.5 leading-relaxed">
              <div class="flex items-start gap-1.5 text-gray-300">
                <span class="text-amber-400 font-bold shrink-0">💡 선정 이유:</span>
                <span>${stock.aiReason}</span>
              </div>
              <div class="flex items-start gap-1.5 text-gray-400 border-t border-gray-800/80 pt-1.5">
                <span class="text-rose-400 font-bold shrink-0">⚠️ 핵심 리스크:</span>
                <span>${stock.aiRisk}</span>
              </div>
            </div>

            <!-- Enhanced Provenance Accordion -->
            <div class="mt-2">
              <button onclick="toggleProvenance('${stock.id}')" class="w-full flex items-center justify-between py-1 px-1 text-[11px] text-gray-400 hover:text-gray-200 transition">
                <span class="flex items-center gap-1 font-medium">
                  <svg class="w-3.5 h-3.5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                  </svg>
                  산출 근거 (Provenance & Target) ${stock.expanded ? '접기' : '상세보기'}
                </span>
                <svg class="w-3.5 h-3.5 transform transition-transform duration-200 ${stock.expanded ? 'rotate-180' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
              </button>

              ${stock.expanded ? `
                <div class="mt-2 p-3 rounded-lg bg-gray-950/95 border border-blue-900/40 text-[11px] text-gray-300 space-y-2 animate-fadeIn">
                  <div class="flex justify-between items-center pb-1.5 border-b border-gray-800">
                    <span class="text-gray-400">상승 목표가 (적정 가치)</span>
                    <span class="font-bold text-emerald-400 text-xs">${Number(targetPrice).toLocaleString()}원 <span class="text-[10px] font-normal text-emerald-300">(+${upsideRate}%)</span></span>
                  </div>

                  <div class="flex justify-between items-center">
                    <span class="text-gray-400">적용 밸류에이션 모델</span>
                    <span class="font-semibold text-blue-300">${stock.provenance.model}</span>
                  </div>

                  <div class="flex justify-between items-center">
                    <span class="text-gray-400">Target 평가 배수</span>
                    <span class="font-mono text-gray-200">${stock.provenance.targetMultiple}</span>
                  </div>

                  <div class="flex justify-between items-center">
                    <span class="text-gray-400">역사적 밴드 위치</span>
                    <span class="font-semibold text-amber-400">${stock.provenance.historicalPercentile || '하위 15% 이내 저평가'}</span>
                  </div>

                  <div class="flex justify-between items-center">
                    <span class="text-gray-400">손익비 (Risk/Reward)</span>
                    <span class="font-semibold text-cyan-400">${stock.provenance.riskRewardRatio || '1 : 3.5'}</span>
                  </div>

                  <div class="flex justify-between items-start gap-2 pt-1 border-t border-gray-800/80">
                    <span class="text-gray-400 shrink-0">기술적 보정치</span>
                    <span class="text-right text-gray-300 font-medium">${stock.provenance.techAdjustment}</span>
                  </div>

                  <div class="text-[9px] text-gray-500 pt-0.5 text-right">기준일자: ${stock.provenance.baseDate}</div>
                </div>
              ` : ''}
            </div>

            ${stock.status === 'AI_DISCOVERY' ? `
              <div class="mt-3 pt-2.5 border-t border-indigo-900/40 flex items-center justify-between gap-2 bg-indigo-950/30 -mx-4 -mb-4 px-4 py-2.5">
                <div class="flex items-center gap-1.5 text-[11px] text-indigo-300 font-medium">
                  <span class="inline-block w-1.5 h-1.5 rounded-full bg-indigo-400"></span>
                  <span>AI 발굴 점수: <b class="text-indigo-200">${stock.aiScore || 90}점</b></span>
                </div>
                <button onclick="moveToCart('${stock.id}')" class="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow-md shadow-emerald-600/30 active:scale-95 transition flex items-center gap-1">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                  <span>장바구니 담기</span>
                </button>
              </div>
            ` : (stock.status === 'CART' ? `
              <div class="mt-3 pt-2 border-t border-gray-700/60 flex items-center justify-between text-[11px] text-gray-400">
                <span class="flex items-center gap-1 text-emerald-400 font-medium">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                  장바구니 실시간 감시 중
                </span>
                <span class="text-[10px] text-gray-500">목표가: ${formatKRW(targetPrice)} (+${upsideRate}%)</span>
              </div>
            ` : '')}

          </div>
        `;
      }).join('');
    }

    // Modal & Smart Search Logic (Fuzzy / Token / Alias Search)
    function openAddModal() {
      document.getElementById('addModal').classList.remove('hidden');
      renderQuickPills();
      document.getElementById('smartSearchInput').focus();
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.add('hidden');
      document.getElementById('addStockForm').reset();
      document.getElementById('smartSearchInput').value = '';
      document.getElementById('searchResultsDropdown').classList.add('hidden');
      document.getElementById('autoFillSuccessAlert').classList.add('hidden');
    }

    function renderQuickPills() {
      const pillsContainer = document.getElementById('quickPills');
      const popularStocks = [
        { label: 'TIGER 미국S&P500', ticker: '360750' },
        { label: 'TIGER 미국나스닥100', ticker: '133690' },
        { label: 'SOL 미국배당다우존스', ticker: '446720' },
        { label: '카카오', ticker: '035720' },
        { label: '한화에어로', ticker: '012450' },
        { label: '두산에너', ticker: '034020' },
        { label: '기아', ticker: '000270' },
        { label: '삼양식품', ticker: '003230' }
      ];
      pillsContainer.innerHTML = popularStocks.map(item => {
        return `
          <button type="button" onclick="selectStockByTicker('${item.ticker}')" class="px-2 py-0.5 rounded-md bg-gray-800 hover:bg-blue-600 hover:text-white border border-gray-700 text-gray-300 text-[10px] transition">
            + ${item.label}
          </button>
        `;
      }).join('');
    }

    // Multi-Keyword & Alias Matcher
    function isStockMatched(stock, query) {
      const cleanQ = query.toLowerCase().replace(/\s+/g, '').replace(/&/g, '');
      if (!cleanQ) return false;

      // 1. Ticker exact or substring match
      if (stock.ticker.includes(cleanQ)) return true;

      // 2. Name & Aliases match
      const allSearchable = [stock.name, stock.ticker, ...(stock.aliases || [])].map(s => s.toLowerCase().replace(/\s+/g, '').replace(/&/g, ''));
      if (allSearchable.some(s => s.includes(cleanQ) || cleanQ.includes(s))) return true;

      // 3. Multi-token match (e.g. 'tiger' AND 's&p500')
      const tokens = query.toLowerCase().split(/\s+/).filter(Boolean);
      const fullText = (stock.name + ' ' + stock.ticker + ' ' + (stock.aliases || []).join(' ')).toLowerCase().replace(/&/g, '');
      return tokens.every(t => fullText.includes(t.replace(/&/g, '')));
    }

    function handleSmartSearch(keyword) {
      const dropdown = document.getElementById('searchResultsDropdown');
      const trimmed = keyword.trim();
      if (!trimmed) {
        dropdown.classList.add('hidden');
        return;
      }

      const matches = STOCK_KNOWLEDGE_BASE.filter(s => isStockMatched(s, trimmed));

      if (matches.length === 0) {
        dropdown.innerHTML = `
          <div class="p-3 text-gray-400 text-center space-y-1">
            <p>'${keyword}' 프리셋을 찾을 수 없습니다.</p>
            <p class="text-[10px] text-blue-400">아래 폼에 티커와 가격을 직접 입력하시면 Buy Zone이 자동 산출됩니다.</p>
          </div>
        `;
        dropdown.classList.remove('hidden');
        return;
      }

      dropdown.innerHTML = matches.map(stock => `
        <div onclick="selectStockByTicker('${stock.ticker}')" class="p-2.5 hover:bg-gray-800 cursor-pointer flex items-center justify-between transition">
          <div>
            <span class="font-bold text-white text-xs">${stock.name}</span>
            <span class="text-[10px] text-gray-400 font-mono ml-1">(${stock.ticker})</span>
            <span class="text-[9px] px-1.5 py-0.2 rounded ${stock.market === 'ETF' ? 'bg-cyan-500/20 text-cyan-300' : 'bg-gray-700 text-gray-300'} ml-1 font-medium">${stock.market}</span>
          </div>
          <div class="text-right">
            <span class="font-bold text-emerald-400">${Number(stock.currentPrice).toLocaleString()}원</span>
            <span class="block text-[9px] text-gray-500">Buy: ${Number(stock.buyZoneLow).toLocaleString()}~${Number(stock.buyZoneHigh).toLocaleString()}</span>
          </div>
        </div>
      `).join('');
      dropdown.classList.remove('hidden');
    }

    // Direct Ticker Input Auto-Fill (티커 6자리 입력 시 즉시 자동 완성)
    function handleTickerDirectInput(tickerValue) {
      const cleanTicker = tickerValue.trim();
      if (cleanTicker.length === 6) {
        const found = STOCK_KNOWLEDGE_BASE.find(s => s.ticker === cleanTicker);
        if (found) {
          fillFormWithStock(found);
        }
      }
    }

    function selectStockByTicker(ticker) {
      const found = STOCK_KNOWLEDGE_BASE.find(s => s.ticker === ticker);
      if (found) fillFormWithStock(found);
    }

    function fillFormWithStock(stock) {
      document.getElementById('inputName').value = stock.name;
      document.getElementById('inputTicker').value = stock.ticker;
      document.getElementById('inputCurrentPrice').value = stock.currentPrice;
      document.getElementById('inputBuyLow').value = stock.buyZoneLow;
      document.getElementById('inputBuyHigh').value = stock.buyZoneHigh;
      document.getElementById('inputStopLoss').value = stock.stopLoss || Math.round(stock.buyZoneLow * 0.96);
      document.getElementById('inputMarket').value = stock.market;
      document.getElementById('inputAiReason').value = stock.aiReason;
      document.getElementById('inputAiRisk').value = stock.aiRisk;
      document.getElementById('inputModel').value = stock.provenance.model;
      document.getElementById('inputTargetMultiple').value = stock.provenance.targetMultiple;
      document.getElementById('inputTechAdjustment').value = stock.provenance.techAdjustment;
      document.getElementById('inputTargetPrice').value = stock.provenance.targetPrice || Math.round(stock.buyZoneHigh * 1.25);

      document.getElementById('searchResultsDropdown').classList.add('hidden');
      document.getElementById('smartSearchInput').value = stock.name;

      const alertBox = document.getElementById('autoFillSuccessAlert');
      document.getElementById('autoFillAlertText').innerText = `'${stock.name}' (${stock.ticker}) 밸류에이션 및 목표가 데이터가 자동 입력되었습니다.`;
      alertBox.classList.remove('hidden');
      alertBox.classList.add('flex');
    }

    function autoCalculateIfCustom() {
      const price = Number(document.getElementById('inputCurrentPrice').value);
      if (!price) return;
      const lowInput = document.getElementById('inputBuyLow');
      const highInput = document.getElementById('inputBuyHigh');
      const stopInput = document.getElementById('inputStopLoss');
      const targetInput = document.getElementById('inputTargetPrice');

      if (!highInput.value) highInput.value = Math.round((price * 0.98) / 100) * 100;
      if (!lowInput.value) lowInput.value = Math.round((price * 0.94) / 100) * 100;
      if (!stopInput.value) stopInput.value = Math.round((price * 0.90) / 100) * 100;
      if (!targetInput.value) targetInput.value = Math.round((price * 1.20) / 100) * 100;
    }

    function handleAddStock(e) {
      e.preventDefault();
      const name = document.getElementById('inputName').value.trim();
      const ticker = document.getElementById('inputTicker').value.trim();
      const currentPrice = Number(document.getElementById('inputCurrentPrice').value);
      const buyZoneLow = Number(document.getElementById('inputBuyLow').value);
      const buyZoneHigh = Number(document.getElementById('inputBuyHigh').value);
      const stopLoss = Number(document.getElementById('inputStopLoss').value);
      const market = document.getElementById('inputMarket').value;
      const status = document.getElementById('inputStatus').value;
      const aiReason = document.getElementById('inputAiReason').value.trim();
      const aiRisk = document.getElementById('inputAiRisk').value.trim();

      const model = document.getElementById('inputModel').value.trim() || '12M Forward 밸류에이션 모델';
      const targetMultiple = document.getElementById('inputTargetMultiple').value.trim() || 'PER 9.5x (하단 밴드)';
      const techAdjustment = document.getElementById('inputTechAdjustment').value.trim() || '이동평균선 지지 버퍼 (-1.5%)';
      const targetPrice = Number(document.getElementById('inputTargetPrice').value) || Math.round(buyZoneHigh * 1.25);

      const newStock = {
        id: 'stock-' + ticker + '-' + Date.now(),
        name,
        ticker,
        market,
        currentPrice,
        dayChangeRate: 0.0,
        buyZoneLow,
        buyZoneHigh,
        stopLoss,
        status,
        aiScore: market === 'ETF' ? 92 : 85,
        aiReason,
        aiRisk,
        provenance: {
          model,
          baseDate: '2026-09-20',
          targetMultiple,
          targetPrice,
          historicalPercentile: '지수 기술적 조정 밴드',
          riskRewardRatio: '1 : 3.5',
          techAdjustment
        },
        expanded: false
      };

      stockData.unshift(newStock);
      saveStocks();
      closeAddModal();
      renderTabs();
      renderStockCards();
    }


    // -------------------------------------------------------------
    // AI 종목 발굴 & 실시간 시세 연동 파이프라인 (Realtime Engine)
    // -------------------------------------------------------------
    function showToast(message, type = 'emerald') {
      const container = document.getElementById('toastContainer');
      if (!container) return;

      const toast = document.createElement('div');
      const bgBorder = type === 'emerald' 
        ? 'bg-emerald-950/95 border-emerald-500/60 text-emerald-200 shadow-emerald-900/30' 
        : (type === 'rose' ? 'bg-rose-950/95 border-rose-500/60 text-rose-200 shadow-rose-900/30' : 'bg-gray-900/95 border-gray-700 text-gray-200');

      toast.className = `pointer-events-auto flex items-start gap-2.5 p-3 rounded-xl border shadow-2xl backdrop-blur-md transition-all duration-300 transform -translate-y-2 opacity-0 ${bgBorder}`;
      toast.innerHTML = `
        <div class="mt-0.5 text-base shrink-0">🔔</div>
        <div class="flex-1 text-xs leading-relaxed font-medium">${message}</div>
        <button onclick="this.parentElement.remove()" class="text-gray-400 hover:text-white text-xs ml-1 font-bold">✕</button>
      `;

      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.remove('-translate-y-2', 'opacity-0');
        toast.classList.add('translate-y-0', 'opacity-100');
      }, 20);

      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 4500);
    }

    function moveToCart(id) {
      const target = stockData.find(s => s.id === id);
      if (target) {
        target.status = 'CART';
        saveStocks();
        renderTabs();
        renderStockCards();
        showToast(`🛒 [${target.name}] 관심 장바구니에 담았습니다! 실시간 감시를 시작합니다.`, 'emerald');
      }
    }

    function reloadAiPicks() {
      const topPicks = [
        '478340', // 나라스페이스테크놀로지
        '000660', // SK하이닉스
        '183300', // 코미코
        '012450', // 한화에어로스페이스
        '035420'  // NAVER
      ];

      topPicks.forEach(ticker => {
        let existing = stockData.find(s => s.ticker === ticker);
        if (existing) {
          existing.status = 'AI_DISCOVERY';
        } else {
          const preset = STOCK_KNOWLEDGE_BASE.find(s => s.ticker === ticker);
          if (preset) {
            stockData.push({
              ...preset,
              id: 'stock-' + preset.ticker,
              status: 'AI_DISCOVERY',
              expanded: false
            });
          }
        }
      });

      saveStocks();
      renderTabs();
      renderStockCards();
      showToast('🤖 AI 3단계 스크리닝이 완료되어 최신 유망 종목 5개가 로드되었습니다!', 'emerald');
    }

    let isRealtimeRunning = true;
    let realtimeTimer = null;
    let isBackendConnected = false;

    function toggleRealtimeEngine() {
      isRealtimeRunning = !isRealtimeRunning;
      const btn = document.getElementById('btnToggleLive');
      const text = document.getElementById('liveStatusText');
      const ping = document.getElementById('livePulsePing');
      const dot = document.getElementById('livePulseDot');

      if (isRealtimeRunning) {
        if (btn) btn.textContent = '일시정지';
        if (text) text.textContent = isBackendConnected ? '네이버 금융 실시간 시세 연동 중' : '실시간 시세 자동 갱신 중';
        if (ping) ping.classList.remove('hidden');
        if (dot) dot.className = 'relative inline-flex rounded-full h-2 w-2 bg-emerald-500';
        showToast('실시간 시세 자동 갱신이 재개되었습니다.', 'emerald');
      } else {
        if (btn) btn.textContent = '시세 재개';
        if (text) text.textContent = '실시간 시세 일시정지됨';
        if (ping) ping.classList.add('hidden');
        if (dot) dot.className = 'relative inline-flex rounded-full h-2 w-2 bg-gray-500';
        showToast('실시간 시세 자동 갱신이 일시정지되었습니다.', 'gray');
      }
    }

    async function fetchRealtimePrices() {
      if (!isRealtimeRunning || stockData.length === 0) return;

      const tickers = stockData.map(s => s.ticker).filter(Boolean);
      let updatedCount = 0;

      // 1순위: 로컬 파이썬 백엔드 서버 (PC 구동 시)
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 1500);
        const res = await fetch(`/api/prices?tickers=${tickers.join(',')}`, { signal: controller.signal });
        clearTimeout(timeoutId);

        if (res.ok) {
          const data = await res.json();
          if (data.success && data.prices) {
            isBackendConnected = true;
            const statusEl = document.getElementById('liveStatusText');
            if (statusEl && isRealtimeRunning) {
              statusEl.textContent = '🟢 네이버 금융 실시간 연동 (Live)';
              statusEl.className = 'font-medium text-emerald-400';
            }

            tickers.forEach(ticker => {
              const info = data.prices[ticker];
              if (info && info.success && info.price > 0) {
                updateStockPriceInRuntime(ticker, info.price, info.diff, info.rate);
                updatedCount++;
              }
            });
            updateTimestamp();
            return;
          }
        }
      } catch (err) {
        // 로컬 서버 없음 -> 모바일 단독 실행 브릿지로 전환
      }

      // 2순위: 스마트폰 브라우저 단독 실행 시 -> 공용 CORS 게이트웨이를 통한 네이버 금융 실시간 직결
      try {
        // 한 번에 2~3종목씩 순차 비동기 갱신 (부하 방지)
        const targetTicker = tickers[Math.floor(Math.random() * tickers.length)];
        const naverMobileUrl = `https://m.stock.naver.com/api/stock/${targetTicker}/realtime`;
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(naverMobileUrl)}`;

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 2500);
        const res = await fetch(proxyUrl, { signal: controller.signal });
        clearTimeout(timeoutId);

        if (res.ok) {
          const raw = await res.json();
          const nowStr = String(raw.nowValue || '0').replace(/,/g, '');
          const changeStr = String(raw.changeValue || '0').replace(/,/g, '');
          const changeType = raw.changeType?.name || 'FLAT';
          const rateStr = String(raw.changeRate || '0.0');

          const price = parseInt(nowStr, 10);
          let diff = parseInt(changeStr, 10);
          if (changeType === 'FALL') diff = -diff;
          const rate = parseFloat(rateStr);

          if (price > 0) {
            updateStockPriceInRuntime(targetTicker, price, diff, rate);
            const statusEl = document.getElementById('liveStatusText');
            if (statusEl && isRealtimeRunning) {
              statusEl.textContent = '🟢 네이버 금융 모바일 실시간 (Live)';
              statusEl.className = 'font-medium text-emerald-400';
            }
            updateTimestamp();
            return;
          }
        }
      } catch (bridgeErr) {
        // 모바일 브릿지 실패 시 안전 시뮬레이터로 처리
      }

      // 3순위: 네트워크 불량 또는 오프라인 시 모의 시뮬레이터 가동
      const statusEl = document.getElementById('liveStatusText');
      if (statusEl && isRealtimeRunning) {
        statusEl.textContent = '실시간 시뮬레이션 가동 중 (Live Sim)';
        statusEl.className = 'font-medium text-blue-400';
      }
      runLocalSimulationTick();
      updateTimestamp();
    }

    function updateTimestamp() {
      const now = new Date();
      const timeStr = now.toTimeString().split(' ')[0];
      const timeEl = document.getElementById('lastUpdatedTime');
      if (timeEl) timeEl.textContent = `${timeStr} 갱신`;
    }

    function runLocalSimulationTick() {
      if (stockData.length === 0) return;
      const targetStock = stockData[Math.floor(Math.random() * stockData.length)];
      if (!targetStock) return;

      const pct = (Math.random() * 0.008 - 0.004);
      const delta = Math.round((targetStock.currentPrice * pct) / 100) * 100;
      if (delta !== 0) {
        const newPrice = Math.max(100, targetStock.currentPrice + delta);
        const diff = (targetStock.dayChange || 0) + delta;
        const rate = parseFloat((((newPrice - (targetStock.currentPrice - (targetStock.dayChange || 0))) / (targetStock.currentPrice - (targetStock.dayChange || 0))) * 100).toFixed(2));
        updateStockPriceInRuntime(targetStock.ticker, newPrice, diff, rate);
      }
    }

    function updateStockPriceInRuntime(ticker, newPrice, diff, rate) {
      const stock = stockData.find(s => s.ticker === ticker);
      if (!stock) return;

      const oldPrice = stock.currentPrice;
      if (oldPrice === newPrice) return;

      const oldAction = getStockAction(stock);
      stock.currentPrice = newPrice;
      stock.dayChange = diff;
      stock.dayChangeRate = rate;
      const newAction = getStockAction(stock);

      if (!oldAction.isBuyZone && newAction.isBuyZone) {
        showToast(`🎯 [${stock.name}] 현재가(${formatKRW(newPrice)})가 Buy Zone(${formatKRW(stock.buyZoneLow)}~${formatKRW(stock.buyZoneHigh)})에 진입했습니다! 분할 매수를 검토하세요.`, 'emerald');
      }

      const priceEl = document.getElementById(`price-${stock.ticker}`);
      if (priceEl) {
        priceEl.textContent = formatKRW(newPrice);
        priceEl.classList.remove('flash-rise', 'flash-fall');
        void priceEl.offsetWidth;
        if (newPrice > oldPrice) {
          priceEl.classList.add('flash-rise');
        } else {
          priceEl.classList.add('flash-fall');
        }
      }

      const changeEl = document.getElementById(`change-${stock.ticker}`);
      if (changeEl) {
        const isUp = (stock.dayChangeRate || 0) > 0;
        const changeColor = isUp ? 'text-rose-400' : 'text-blue-400';
        const changeSign = isUp ? '+' : '';
        changeEl.className = `text-xs font-semibold ${changeColor}`;
        changeEl.innerHTML = `${changeSign}${(stock.dayChangeRate || 0).toFixed(2)}%`;
      }

      saveStocks();
      renderTabs();
    }

    function initRealtimeEngine() {
      if (realtimeTimer) clearInterval(realtimeTimer);
      realtimeTimer = setInterval(fetchRealtimePrices, 3000);
      fetchRealtimePrices();
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderTabs();
      renderStockCards();
      initRealtimeEngine();
    });
  </script>
