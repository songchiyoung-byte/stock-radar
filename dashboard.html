  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }

      50% { opacity: 0.6; }
    }
    .pulse-soft { animation: pulseSoft 2s infinite ease-in-out; }
  </style>
</head>
<body class="bg-finBg text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-blue-500 selection:text-white">

  <!-- Main Container -->
  <div class="w-full max-w-lg mx-auto flex-1 flex flex-col pb-24 shadow-2xl relative border-x border-slate-800 bg-finBg">

    <!-- Top Header -->
    <header class="sticky top-0 z-30 bg-finBg/95 backdrop-blur-md px-4 pt-3.5 pb-2.5 border-b border-finBorder">
      <div class="flex items-center justify-between mb-3">
        <div>
          <h1 class="text-base font-extrabold tracking-tight text-white flex items-center gap-1.5">
            Buy Zone Radar
            <span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-400 border border-blue-500/30">PRO</span>
          </h1>
          <p class="text-[11px] text-slate-400 mt-0.5">실시간 매수 타이밍 & 밸류에이션 판별기</p>
        </div>

        <button onclick="openAddModal()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-xs font-semibold text-white shadow-md shadow-blue-600/20 active:scale-95 transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
          <span>종목 검색·체크</span>
        </button>
      </div>

      <!-- Realtime Status Ribbon -->
      <div class="flex items-center justify-between px-2.5 py-1.5 rounded-md bg-slate-900/90 border border-slate-800 text-[11px]">
        <div class="flex items-center gap-2">
          <span class="relative flex h-2 w-2">
            <span id="livePing" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
          </span>
          <span id="liveStatusText" class="font-medium text-emerald-400">증권사 실시간 시세 연동</span>
        </div>
        <span id="lastUpdatedTime" class="text-[10px] text-slate-400 font-mono">연결 중...</span>
      </div>

      <!-- Two Core Tabs: 1) AI 추천 / 2) 내 관심 판별기 -->
      <div class="grid grid-cols-2 gap-1.5 mt-2.5 p-1 bg-slate-900 rounded-lg border border-slate-800 text-xs font-semibold">
        <button onclick="switchMainTab('AI_PICKS')" id="tabBtnAi" class="py-1.5 rounded-md text-center transition-all bg-blue-600 text-white shadow font-bold">
          🤖 AI 매수추천 (<span id="countAiPicks">0</span>)
        </button>
        <button onclick="switchMainTab('WATCHLIST')" id="tabBtnWatch" class="py-1.5 rounded-md text-center transition-all text-slate-400 hover:text-white">
          📋 내 판별 장바구니 (<span id="countWatchlist">0</span>)
        </button>
      </div>
    </header>

    <!-- Content List -->
    <main class="flex-1 px-4 py-3 space-y-3" id="stockListContainer"></main>

    <!-- Empty State -->
    <div id="emptyState" class="hidden flex-col items-center justify-center py-16 px-4 text-center">
      <div class="w-12 h-12 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-500 mb-2">🔍</div>

    </div>
  </div>

  <!-- Search & Valuation Modal -->
  <div id="addModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-finCard w-full max-w-md rounded-t-2xl sm:rounded-2xl border border-finBorder p-5 max-h-[90vh] overflow-y-auto shadow-2xl">

        <div>
          <h2 class="text-sm font-bold text-white flex items-center gap-1.5">

        <button onclick="closeAddModal()" class="text-slate-400 hover:text-white p-1 text-sm font-bold">✕</button>
      </div>

      <div class="mb-4">
        <input type="text" id="smartSearchInput" oninput="handleSmartSearch(this.value)" placeholder="예: 하이닉스, 삼성전자, S&P500, 005930..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white placeholder-slate-500 focus:border-blue-500 focus:outline-none font-medium">
        <div id="searchResultsDropdown" class="hidden mt-1 max-h-48 overflow-y-auto rounded-lg bg-slate-950 border border-slate-700 divide-y divide-slate-800 text-xs"></div>
        <div class="mt-2 flex flex-wrap gap-1" id="quickPills"></div>
      </div>

      <form id="addStockForm" onsubmit="handleAddStock(event)" class="space-y-3 text-xs">
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-slate-400 mb-1">종목명</label>
            <input type="text" id="inputName" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white">
          </div>
          <div>
            <label class="block text-slate-400 mb-1">티커(6자리)</label>
            <input type="text" id="inputTicker" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white font-mono">
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="block text-slate-400 mb-1">현재가 (원)</label>
            <input type="number" id="inputCurrentPrice" onchange="autoCalculateBuyZone()" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-white">
          </div>
          <div>
            <label class="block text-emerald-400 mb-1">Buy Zone 하단</label>
            <input type="number" id="inputBuyLow" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-white">
          </div>
          <div>
            <label class="block text-emerald-400 mb-1">Buy Zone 상단</label>
            <input type="number" id="inputBuyHigh" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-white">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-rose-400 mb-1">손절선(Stop)</label>
            <input type="number" id="inputStopLoss" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white">
          </div>
          <div>
            <label class="block text-blue-400 mb-1">상승 목표가</label>
            <input type="number" id="inputTargetPrice" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white">
          </div>
        </div>

        <div>
          <label class="block text-slate-400 mb-1">적용 밸류에이션 모델 (Provenance)</label>
          <input type="text" id="inputModel" placeholder="예: 12M Fwd P/B 밴드 하단 모델" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white">
        </div>

        <div class="flex items-center gap-2 pt-2">
          <button type="button" onclick="closeAddModal()" class="flex-1 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-300 font-semibold">취소</button>
          <button type="submit" class="flex-1 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-semibold shadow">판별 목록에 추가</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let currentMainTab = 'AI_PICKS';
    // 스토리지 키 버전을 올려 구버전(7만 원대) 캐시를 즉각 자동 무효화

    const STOCK_DATABASE = [

        }
      },
      {

        market: 'KOSPI',

        stopLoss: 1590000,
        isAiRecommended: false,

          thesis: 'HBM3E 독점적 지위 지속 및 빅테크 AI 가속기 탑재량 확대',

        }
      },

          targetPrice: 31000,
          targetMultiple: 'P/E 21.5x (정상 복귀치)',
          historicalBand: '지수 기술적 조정 중간 밴드 (52%)',
          riskReward: '1 : 3.8',
          techPoint: '120일 이동평균선 이격도 98% 눌림목 지지선',

        }
      },
      {

        stopLoss: 78000,
        isAiRecommended: true,
        provenance: {

          targetPrice: 98000,
          targetMultiple: 'P/B 1.35x',
          historicalBand: '하위 18% 저평가 구간',

          techPoint: '박스권 중단 지지선 확인',
          thesis: '체코 원전 수주 및 글로벌 SMR 파운드리 수혜 독점',
          risk: '원전 착공 일정 변동 및 정책 피로감'
        }
      },
      {
        name: 'NAVER',
        ticker: '035420',
        market: 'KOSPI',
        currentPrice: 197500,
        dayChangeRate: 0.76,
        buyZoneLow: 190000,
        buyZoneHigh: 198000,
        stopLoss: 175000,
        isAiRecommended: true,
        provenance: {
          model: '10년 최저 P/E 밴드 회귀 모델',
          targetPrice: 225000,
          targetMultiple: 'PER 15.2x (역사적 하단)',
          historicalBand: '하위 3.1% 극단적 저평가',
          riskReward: '1 : 5.9',
          techPoint: '주봉 쌍바닥 지지 라인 형성',
          thesis: 'AI 검색 브리핑 도입에 따른 광고 단가 회복 및 커머스 쇄신',
          risk: '중국 C-커머스 경쟁 심화 및 AI 인프라 투자 비용'
        }
      }
    ];

    let userStocks = loadStocks();

    function loadStocks() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return JSON.parse(saved);
      } catch (e) {}
      // 기본 장바구니에 삼성전자, SK하이닉스, TIGER 미국S&P500 배치
      return STOCK_DATABASE.map(s => ({
        ...s,
        id: 'stock-' + s.ticker,
        inWatchlist: (s.ticker === '005930' || s.ticker === '000660' || s.ticker === '360750'),
        expanded: false
      }));
    }

    function saveStocks() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(userStocks));
      } catch (e) {}
    }

    function diagnoseStock(stock) {
      const p = stock.currentPrice;
      const low = stock.buyZoneLow;
      const high = stock.buyZoneHigh;
      const stop = stock.stopLoss;

      if (p < stop) {
        const diff = (((stop - p) / stop) * 100).toFixed(1);
        return {
          status: 'STOP_LOSS',
          badgeText: `손절선 이탈 (-${diff}%)`,
          badgeClass: 'bg-rose-500/20 text-rose-400 border-rose-500/40',
          title: '매수 보류 / 리스크 관리',
          desc: `지지선(${stop.toLocaleString()}원)을 하회했습니다. 추가 하락 위험으로 진입을 멈춥니다.`,
          isInside: false,
          posType: 'BELOW'
        };
      }

      if (p >= low && p <= high) {
        const mid = (low + high) / 2;
        const step = p <= mid ? '2차 적극 분할 (40%)' : '1차 분할 진입 (30%)';
        return {
          status: 'IN_ZONE',
          badgeText: `🎯 매수 적기 (${step})`,
          badgeClass: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/50 pulse-soft font-bold',
          title: 'System Buy Zone 진입 (안전마진 확보)',
          desc: `적정 밸류에이션 밴드 내에 위치하여 분할 매수가 안전한 구간입니다.`,
          isInside: true,
          posType: 'INSIDE'
        };
      }

      if (p > high) {
        const gap = (((p - high) / high) * 100).toFixed(1);
        const isNear = (p - high) / high <= 0.03;
        return {
          status: isNear ? 'APPROACHING' : 'OVER_PRICED',
          badgeText: isNear ? `⚡ 밴드 근접 (+${gap}%)` : `⛔ 매수 범위 초과 (+${gap}%)`,
          badgeClass: isNear ? 'bg-amber-500/20 text-amber-300 border-amber-500/40' : 'bg-slate-800 text-slate-400 border-slate-700',
          title: isNear ? '진입 대기 (1~2% 조정 시 매수)' : '관망 (추격 매수 금지)',
          desc: `적정 매수 상단(${high.toLocaleString()}원)보다 ${gap}% 비쌉니다. 가격 조정을 기다리세요.`,
          isInside: false,
          posType: 'ABOVE',
          gap
        };
      }

      return {
        status: 'WATCH',
        badgeText: '관망',
        badgeClass: 'bg-slate-800 text-slate-400 border-slate-700',
        title: '관망 대기',
        desc: '현재가 추이를 관찰합니다.',
        isInside: false,
        posType: 'NEUTRAL'
      };
    }

    function formatKRW(val) {
      return Number(val).toLocaleString('ko-KR') + '원';
    }

    function switchMainTab(tab) {
      currentMainTab = tab;
      const btnAi = document.getElementById('tabBtnAi');
      const btnWatch = document.getElementById('tabBtnWatch');

      if (tab === 'AI_PICKS') {
        btnAi.className = 'py-1.5 rounded-md text-center transition-all bg-blue-600 text-white shadow font-bold';
        btnWatch.className = 'py-1.5 rounded-md text-center transition-all text-slate-400 hover:text-white';
      } else {
        btnWatch.className = 'py-1.5 rounded-md text-center transition-all bg-blue-600 text-white shadow font-bold';
        btnAi.className = 'py-1.5 rounded-md text-center transition-all text-slate-400 hover:text-white';
      }
      renderList();
    }

    function toggleProvenance(id) {
      const item = userStocks.find(s => s.id === id);
      if (item) {
        item.expanded = !item.expanded;
        saveStocks();
        renderList();
      }
    }

    function toggleWatchlist(id) {
      const item = userStocks.find(s => s.id === id);
      if (item) {
        item.inWatchlist = !item.inWatchlist;
        saveStocks();
        renderList();
      }
    }

    function renderRangeBar(stock, diag) {
      let markerPos = '50%';
      let markerColor = 'bg-blue-400';
      let stateLabel = '';

      if (diag.posType === 'INSIDE') {
        const ratio = (stock.currentPrice - stock.buyZoneLow) / (stock.buyZoneHigh - stock.buyZoneLow);
        markerPos = `${Math.min(95, Math.max(5, ratio * 100))}%`;
        markerColor = 'bg-emerald-400 ring-2 ring-emerald-300';
        stateLabel = '<span class="text-emerald-400 font-bold">밴드 내부 진입</span>';
      } else if (diag.posType === 'ABOVE') {
        markerPos = '96%';
        markerColor = 'bg-amber-400';
        stateLabel = `<span class="text-amber-400 font-bold">상단 초과 (+${diag.gap}%)</span>`;
      } else {
        markerPos = '4%';
        markerColor = 'bg-rose-400';
        stateLabel = '<span class="text-rose-400 font-bold">지지선 이탈</span>';
      }

      return `
        <div class="mt-2.5 pt-2 border-t border-slate-800">
          <div class="flex items-center justify-between text-[11px] mb-1">
            <span class="text-slate-400">Buy Zone 밴드: <b class="text-slate-200">${formatKRW(stock.buyZoneLow)} ~ ${formatKRW(stock.buyZoneHigh)}</b></span>
            <span>${stateLabel}</span>
          </div>
          <div class="relative w-full h-2 bg-slate-900 rounded-full border border-slate-700/80 overflow-hidden my-1.5">
            <div class="absolute inset-y-0 bg-emerald-500/30 border-x border-emerald-500/60" style="left: 25%; width: 50%;"></div>
            <div class="absolute top-1/2 -translate-y-1/2 w-2.5 h-2.5 rounded-full ${markerColor} shadow" style="left: ${markerPos}; transform: translate(-50%, -50%);"></div>
          </div>
          <div class="flex justify-between text-[9px] text-slate-500">
            <span>손절 ${formatKRW(stock.stopLoss)}</span>
            <span class="text-slate-400">밴드 중심</span>
            <span>목표 ${formatKRW(stock.provenance?.targetPrice || stock.buyZoneHigh * 1.2)}</span>
          </div>
        </div>
      `;
    }

    function renderList() {
      const container = document.getElementById('stockListContainer');
      const emptyState = document.getElementById('emptyState');

      const aiPicks = userStocks.filter(s => {
        const diag = diagnoseStock(s);
        return diag.status === 'IN_ZONE' || diag.status === 'APPROACHING';
      });
      const watchlist = userStocks.filter(s => s.inWatchlist);

      document.getElementById('countAiPicks').innerText = aiPicks.length;
      document.getElementById('countWatchlist').innerText = watchlist.length;

      const displayList = currentMainTab === 'AI_PICKS' ? aiPicks : watchlist;

      if (displayList.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
        return;
      }
      emptyState.classList.add('hidden');
      emptyState.classList.remove('flex');

      container.innerHTML = displayList.map(stock => {
        const diag = diagnoseStock(stock);
        const isUp = (stock.dayChangeRate || 0) > 0;
        const changeColor = isUp ? 'text-rose-400' : 'text-blue-400';
        const changeSign = isUp ? '+' : '';
        const target = stock.provenance?.targetPrice || Math.round(stock.buyZoneHigh * 1.25);
        const upside = (((target - stock.currentPrice) / stock.currentPrice) * 100).toFixed(1);

        return `
          <div class="bg-finCard rounded-xl border border-finBorder p-3.5 shadow-lg relative transition hover:border-slate-600">
            <!-- 종목 헤더: 이름 클릭 시 네이버 증권 공식 페이지로 직결 -->
            <div class="flex items-start justify-between">
              <div>
                <div class="flex items-center gap-1.5">
                  <a href="https://m.stock.naver.com/domestic/stock/${stock.ticker}/total" 
                     target="_blank" 
                     rel="noopener noreferrer" 
                     title="네이버 증권에서 실시간 호가/차트 확인"
                     class="text-sm font-bold text-white tracking-tight hover:text-blue-400 hover:underline flex items-center gap-1 group">
                    <span>${stock.name}</span>
                    <svg class="w-3 h-3 text-slate-400 group-hover:text-blue-400 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                    </svg>
                  </a>
                  <span class="text-[10px] font-mono text-slate-400">${stock.ticker}</span>
                  <span class="text-[9px] px-1 py-0.2 rounded bg-slate-800 text-slate-300 border border-slate-700">${stock.market}</span>
                </div>
                <div class="flex items-baseline gap-2 mt-0.5">
                  <span id="price-${stock.ticker}" class="text-lg font-extrabold text-white font-mono">${formatKRW(stock.currentPrice)}</span>
                  <span id="change-${stock.ticker}" class="text-[11px] font-semibold ${changeColor}">${changeSign}${(stock.dayChangeRate || 0).toFixed(2)}%</span>
                </div>
              </div>

              <div class="flex flex-col items-end gap-1">
                <span class="px-2 py-0.5 rounded-full border text-[11px] font-semibold ${diag.badgeClass}">
                  ${diag.badgeText}
                </span>
                <button onclick="toggleWatchlist('${stock.id}')" class="text-[10px] text-slate-400 hover:text-blue-400 transition flex items-center gap-0.5 mt-0.5">
                  <span>${stock.inWatchlist ? '★ 장바구니 담김' : '+ 장바구니 추가'}</span>
                </button>
              </div>
            </div>

            <!-- Position Range Bar -->
            ${renderRangeBar(stock, diag)}

            <!-- Rule-based Action Box -->
            <div class="mt-2.5 p-2 rounded-lg bg-slate-900/90 border border-slate-800 flex items-center justify-between text-xs">
              <div class="flex items-center gap-1.5">
                <span class="text-blue-400 font-bold">진단:</span>
                <span class="font-semibold ${diag.isInside ? 'text-emerald-400' : 'text-slate-300'}">${diag.title}</span>
              </div>
              <span class="text-[10px] text-slate-400">목표가 <b class="text-slate-200">${formatKRW(target)}</b> (+${upside}%)</span>
            </div>

            <!-- Provenance & Valuation Accordion (산출 근거) -->
            <div class="mt-2">
              <button onclick="toggleProvenance('${stock.id}')" class="w-full flex items-center justify-between py-1 text-[11px] text-slate-400 hover:text-slate-200 transition">
                <span class="flex items-center gap-1 font-medium">
                  <svg class="w-3.5 h-3.5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                  산출 근거 (Provenance) ${stock.expanded ? '접기 ▲' : '상세보기 ▼'}
                </span>
                <span class="text-[10px] text-slate-500">손익비 ${stock.provenance?.riskReward || '1:3.0'}</span>
              </button>

              ${stock.expanded && stock.provenance ? `
                <div class="mt-1.5 p-2.5 rounded-lg bg-slate-950 border border-slate-800 text-[11px] space-y-1.5 text-slate-300">
                  <div class="flex justify-between border-b border-slate-800/80 pb-1">
                    <span class="text-slate-400">적용 밸류에이션 모델</span>
                    <span class="text-blue-300 font-medium">${stock.provenance.model}</span>
                  </div>
                  <div class="flex justify-between">
                    <span class="text-slate-400">목표 밸류에이션 배수</span>
                    <span class="font-mono text-slate-200">${stock.provenance.targetMultiple || '-'}</span>
                  </div>
                  <div class="flex justify-between">
                    <span class="text-slate-400">역사적 밴드 위치</span>
                    <span class="text-amber-400">${stock.provenance.historicalBand || '하위 20% 이내 저평가'}</span>
                  </div>
                  <div class="flex justify-between">
                    <span class="text-slate-400">기술적 보정치</span>
                    <span class="text-slate-300">${stock.provenance.techPoint || '-'}</span>
                  </div>
                  <div class="pt-1.5 border-t border-slate-800/80 text-[10px] text-slate-400 space-y-1">
                    <div>💡 <b>핵심 근거:</b> ${stock.provenance.thesis || '-'}</div>
                    <div>⚠️ <b>주요 리스크:</b> ${stock.provenance.risk || '-'}</div>
                  </div>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    // Modal Search Logic
    function openAddModal() {
      document.getElementById('addModal').classList.remove('hidden');
      renderQuickPills();
      document.getElementById('smartSearchInput').focus();
    }
    function closeAddModal() {
      document.getElementById('addModal').classList.add('hidden');
      document.getElementById('addStockForm').reset();
      document.getElementById('searchResultsDropdown').classList.add('hidden');
    }
    function renderQuickPills() {
      const container = document.getElementById('quickPills');
      const presets = [
        { label: '삼성전자', ticker: '005930' },
        { label: 'SK하이닉스', ticker: '000660' },
        { label: 'TIGER 미국S&P500', ticker: '360750' },
        { label: '두산에너빌리티', ticker: '034020' },
        { label: 'NAVER', ticker: '035420' }
      ];
      container.innerHTML = presets.map(p => `
        <button type="button" onclick="selectPresetByTicker('${p.ticker}')" class="px-2 py-0.5 rounded bg-slate-800 hover:bg-blue-600 hover:text-white text-slate-300 text-[10px] border border-slate-700 transition">
          + ${p.label}
        </button>
      `).join('');
    }
    function handleSmartSearch(query) {
      const dropdown = document.getElementById('searchResultsDropdown');
      const q = query.trim().toLowerCase();
      if (!q) {
        dropdown.classList.add('hidden');
        return;
      }
      const matches = STOCK_DATABASE.filter(s => s.name.toLowerCase().includes(q) || s.ticker.includes(q));
      if (matches.length === 0) {
        dropdown.innerHTML = `<div class="p-2 text-slate-500 text-center text-[11px]">일치하는 프리셋이 없습니다. 아래 폼에 직접 입력하세요.</div>`;
        dropdown.classList.remove('hidden');
        return;
      }
      dropdown.innerHTML = matches.map(s => `
        <div onclick="selectPresetByTicker('${s.ticker}'); document.getElementById('searchResultsDropdown').classList.add('hidden');" class="p-2 hover:bg-slate-800 cursor-pointer flex justify-between items-center text-xs">
          <div><b class="text-white">${s.name}</b> <span class="text-slate-400 font-mono text-[10px]">(${s.ticker})</span></div>
          <span class="text-emerald-400 font-mono">${formatKRW(s.currentPrice)}</span>
        </div>
      `).join('');
      dropdown.classList.remove('hidden');
    }
    function selectPresetByTicker(ticker) {
      const s = STOCK_DATABASE.find(item => item.ticker === ticker);
      if (s) {
        document.getElementById('inputName').value = s.name;
        document.getElementById('inputTicker').value = s.ticker;
        document.getElementById('inputCurrentPrice').value = s.currentPrice;
        document.getElementById('inputBuyLow').value = s.buyZoneLow;
        document.getElementById('inputBuyHigh').value = s.buyZoneHigh;
        document.getElementById('inputStopLoss').value = s.stopLoss;
        document.getElementById('inputTargetPrice').value = s.provenance?.targetPrice || Math.round(s.buyZoneHigh * 1.25);
        document.getElementById('inputModel').value = s.provenance?.model || '12M Forward 밸류에이션 모델';
      }
    }
    function autoCalculateBuyZone() {
      const p = Number(document.getElementById('inputCurrentPrice').value);
      if (!p) return;
      document.getElementById('inputBuyHigh').value = Math.round((p * 0.97) / 100) * 100;
      document.getElementById('inputBuyLow').value = Math.round((p * 0.93) / 100) * 100;
      document.getElementById('inputStopLoss').value = Math.round((p * 0.89) / 100) * 100;
      document.getElementById('inputTargetPrice').value = Math.round((p * 1.20) / 100) * 100;
    }
    function handleAddStock(e) {
      e.preventDefault();
      const ticker = document.getElementById('inputTicker').value.trim();
      const newStock = {
        id: 'stock-' + ticker + '-' + Date.now(),
        name: document.getElementById('inputName').value.trim(),
        ticker,
        market: 'KRX',
        currentPrice: Number(document.getElementById('inputCurrentPrice').value),
        dayChangeRate: 0.0,
        buyZoneLow: Number(document.getElementById('inputBuyLow').value),
        buyZoneHigh: Number(document.getElementById('inputBuyHigh').value),
        stopLoss: Number(document.getElementById('inputStopLoss').value),
        inWatchlist: true,
        expanded: false,
        provenance: {
          model: document.getElementById('inputModel').value.trim() || '사용자 지정 밸류에이션 모델',
          targetPrice: Number(document.getElementById('inputTargetPrice').value),
          targetMultiple: 'PER 하단 밴드',
          historicalBand: '사용자 지정 밴드',
          riskReward: '1 : 3.0',
          techPoint: '지지선 확인',
          thesis: '사용자 관심 종목 매수 판별 등록',
          risk: '시장 변동성 주의'
        }
      };
      userStocks.unshift(newStock);
      saveStocks();
      closeAddModal();
      currentMainTab = 'WATCHLIST';
      switchMainTab('WATCHLIST');
    }

    // Realtime Backend Sync
    async function fetchRealtimePrices() {
      if (userStocks.length === 0) return;
      const tickers = userStocks.map(s => s.ticker).filter(Boolean);

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 6000);
        const res = await fetch(`/api/prices?tickers=${tickers.join(',')}`, { signal: controller.signal });
        clearTimeout(timeoutId);

        if (res.ok) {
          const data = await res.json();
          if (data.success && data.prices) {
            document.getElementById('liveStatusText').textContent = '증권사 실시간 시세 연동 (Live)';
            tickers.forEach(t => {
              const info = data.prices[t];
              if (info && info.success && info.price > 0) {
                const s = userStocks.find(item => item.ticker === t);
                if (s) {
                  s.currentPrice = info.price;
                  s.dayChangeRate = info.rate;

                  const priceEl = document.getElementById(`price-${t}`);
                  if (priceEl) priceEl.textContent = formatKRW(info.price);

                  const changeEl = document.getElementById(`change-${t}`);
                  if (changeEl) {
                    const isUp = info.rate > 0;
                    changeEl.className = `text-[11px] font-semibold ${isUp ? 'text-rose-400' : 'text-blue-400'}`;
                    changeEl.textContent = `${isUp ? '+' : ''}${info.rate.toFixed(2)}%`;
                  }
                }
              }
            });
            saveStocks();
          }
        }
      } catch (err) {}
      const now = new Date();
      document.getElementById('lastUpdatedTime').textContent = `${now.toTimeString().split(' ')[0]} 갱신`;
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderList();
      fetchRealtimePrices();
      setInterval(fetchRealtimePrices, 5000);
    });
  </script>
</body>
</html>
