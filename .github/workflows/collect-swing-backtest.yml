name: Collect swing backtest dataset

on:
  push:
    branches: [main]
    paths:
      - 'api/analysis.py'
      - 'scripts/run_backtest_v1.py'
      - '.github/workflows/collect-swing-backtest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect v1 history
        run: python scripts/run_backtest_v1.py
      - name: Commit dataset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/backtests/swing_v1_latest.json
          git diff --cached --quiet || git commit -m 'Refresh swing v1 backtest dataset'
          git push
